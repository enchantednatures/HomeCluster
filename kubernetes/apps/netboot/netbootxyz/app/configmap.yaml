  # 0c:c4:7a:64:67:3e -> Talos v1.13.9 (schematic 1e37ccf2...)
  MAC-0cc47a64673e.ipxe: |
    #!ipxe
    echo Booting Talos v1.13.9 via Sidero Image Factory...
    chain --autofree https://pxe.factory.talos.dev/pxe/1e37ccf27ce1b716176726acda9130216bd2d4a311381da7011fdca1bbe941a7/v1.13.9/metal-amd64 || shell
