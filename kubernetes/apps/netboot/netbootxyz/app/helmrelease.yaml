# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app netbootxyz
  namespace: netboot
spec:
  maxHistory: 2
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3 # datasource=helm depName=app-template repository=oci://ghcr.io/bjw-s
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: work-00
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      netbootxyz:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          seedbootfiles:
            image:
              repository: docker.io/alpine
              tag: "3.24" # datasource=docker depName=alpine
            command:
              - /bin/sh
              - -c
              - |-
                mkdir -p /config/menus
                wget -q -O /config/menus/netboot.xyz.kpxe https://boot.netboot.xyz/ipxe/netboot.xyz.kpxe
                wget -q -O /config/menus/netboot.xyz.efi https://boot.netboot.xyz/ipxe/netboot.xyz.efi
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image:
              repository: ghcr.io/netbootxyz/netbootxyz
              tag: "0.7.6-nbxyz24" # datasource=docker depName=ghcr.io/netbootxyz/netbootxyz
            env:
              TZ: "${TIMEZONE}"
              PUID: "1000"
              PGID: "1000"
              NGINX_PORT: "80"
              WEB_APP_PORT: "3000"
              TFTPD_OPTS: "--tftp-single-port"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 20
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi

    service:
      webui:
        controller: netbootxyz
        ports:
          http:
            port: 3000

    persistence:
      config:
        enabled: true
        existingClaim: netbootxyz-config
        globalMounts:
          - path: /config
      assets:
        enabled: true
        existingClaim: netbootxyz-assets
        globalMounts:
          - path: /assets
