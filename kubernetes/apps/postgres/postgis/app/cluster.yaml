---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgis-db
  labels:
    app.kubernetes.io/name: postgis-db
spec:
  inheritedMetadata:
    labels:
      istio.io/dataplane-mode: "none"
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgis versioning=redhat
  imageName: ghcr.io/cloudnative-pg/postgis:17-3.5-18
  instances: 3
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: ceph-block
  enableSuperuserAccess: true
  superuserSecret:
    name: postgis-superuser
  postgresql:
    parameters:
      max_connections: "300"
      # Memory configuration - optimized for 4GB total RAM
      shared_buffers: 1GB # 25% of RAM
      effective_cache_size: 3GB # 75% of RAM
      work_mem: 32MB
      maintenance_work_mem: 256MB
      # Write-ahead log
      wal_level: logical
      max_wal_size: 1GB
      min_wal_size: 512MB
      # Query planner
      random_page_cost: "1.1" # Assuming SSD storage
      effective_io_concurrency: "100"
      # Parallel query settings - reduced for smaller instance
      max_parallel_workers_per_gather: "2"
      max_parallel_workers: "4"
      max_parallel_maintenance_workers: "2"
      # OSM specific optimizations
      autovacuum_vacuum_scale_factor: "0.1"
      autovacuum_analyze_scale_factor: "0.05"
      checkpoint_completion_target: "0.9"
      default_statistics_target: "500"
      # Extensions needed for OSM
      # shared_preload_libraries: "postgis"
  # pg_hba:
  #   - host all all 10.244.0.0/16 md5
  monitoring:
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      # Note: serverName version needs to be incremented
      # when recovering from an existing cnpg cluster
      parameters:
        barmanObjectName: minio-store
        serverName: &currentCluster postgis-v7
  # Note: previousCluster needs to be set to the name of the previous
  # cluster when recovering from an existing cnpg cluster
  # postgis-v6 is unrecoverable: its only backup (20250721T000001) has
  # truncated WAL ("WAL ends before end of online backup"). postgis-v5's
  # last backup (20250701T000001, timeline 39) is status=DONE but was
  # judged stale during the 2026-09 rebuild; bootstrapping fresh instead.
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: postgis-app-user
      postInitApplicationSQL:
        - CREATE EXTENSION postgis;
        - CREATE EXTENSION postgis_topology;
        - CREATE EXTENSION fuzzystrmatch;
        - CREATE EXTENSION postgis_tiger_geocoder;
  externalClusters:
    - name: postgis-v5
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: minio-store
          serverName: postgis-v5
