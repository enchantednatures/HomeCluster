# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: austin
  namespace: vms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: austin-arc-admin
rules:
  - apiGroups:
      - actions.github.com
    resources:
      - autoscalingrunnersets
      - autoscalinglisteners
      - ephemeralrunnersets
      - ephemeralrunners
    verbs:
      - "*"
  - apiGroups:
      - actions.github.com
    resources:
      - autoscalingrunnersets/status
      - autoscalinglisteners/status
      - ephemeralrunnersets/status
      - ephemeralrunners/status
      - autoscalingrunnersets/finalizers
      - autoscalinglisteners/finalizers
      - ephemeralrunnersets/finalizers
      - ephemeralrunners/finalizers
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: austin-arc-view
rules:
  - apiGroups:
      - actions.github.com
    resources:
      - autoscalingrunnersets
      - autoscalinglisteners
      - ephemeralrunnersets
      - ephemeralrunners
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - actions.github.com
    resources:
      - autoscalingrunnersets/status
      - autoscalinglisteners/status
      - ephemeralrunnersets/status
      - ephemeralrunners/status
      - autoscalingrunnersets/finalizers
      - autoscalinglisteners/finalizers
      - ephemeralrunnersets/finalizers
      - ephemeralrunners/finalizers
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
