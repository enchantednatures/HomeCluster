# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationdestination_v1alpha1.json
# https://volsync.readthedocs.io/en/stable/usage/restic/index.html
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: home-assistant-restore
  namespace: home-system
spec:
  # Paused by default: Flux reconciles the manifest; trigger manually via
  # kubectl patch on spec.trigger.manual for restore drills
  paused: true
  trigger:
    manual: ""
  restic:
    repository: home-assistant-backup-secret
    copyMethod: Direct
    destinationPVC: home-assistant-config
    cacheStorageClassName: csi-nfs
    cacheCapacity: 5Gi
    # No moverSecurityContext: home-assistant runs as root (pod securityContext
    # runAsUser/Group/fsGroup 0) so restored files stay root-owned and
    # app-readable
