# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
  namespace: home-automation
spec:
  driftDetection:
    mode: enabled
  maxHistory: 2
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3 # datasource=helm depName=app-template repository=oci://ghcr.io/bjw-s/helm
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      # Home Assistant relies on mDNS/SSDP discovery and local LAN broadcasts
      # for several integrations; host networking preserves that behaviour.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Avoid the Unraid worker: this app is being migrated off the tower.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - unraid-worker
    controllers:
      home-assistant:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              # datasource=docker depName=ghcr.io/home-assistant/home-assistant
              tag: 2026.11.0
            env:
              TZ: "America/New_York"
              RECORDER_DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-db-app
                    key: fqdn-uri
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8123
                  periodSeconds: 10
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8123
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8123
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
            appProtocol: kubernetes.io/ws
    persistence:
      config:
        existingClaim: home-assistant-config
        globalMounts:
          - path: /config
