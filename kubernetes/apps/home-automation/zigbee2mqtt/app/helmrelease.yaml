# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app zigbee2mqtt
  namespace: home-automation
spec:
  driftDetection:
    mode: enabled
  maxHistory: 2
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3 # datasource=helm depName=app-template repository=oci://ghcr.io/bjw-s/helm
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Staged until a Zigbee coordinator is attached to a node. To enable:
    # attach the dongle, set controllers.zigbee2mqtt.replicas to 1, replace the
    # usb hostPath below with the coordinator's /dev/serial/by-id path, and pin
    # the pod to that node, e.g.:
    # defaultPodOptions:
    #   nodeSelector:
    #     kubernetes.io/hostname: work-00
    controllers:
      zigbee2mqtt:
        replicas: 0
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              # datasource=docker depName=ghcr.io/koenkk/zigbee2mqtt
              tag: 2.14.2
            env:
              ZIGBEE2MQTT_DATA: /config
              ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: zstack
              ZIGBEE2MQTT_CONFIG_SERIAL_PORT: /dev/ttyUSB0
              ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mosquitto.home-automation.svc.cluster.local:1883
              ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: "8080"
              TZ: "${TIMEZONE}"
            securityContext:
              # TODO: privileged is required to open the USB coordinator device;
              # revisit once access can be granted without it.
              privileged: true
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: zigbee2mqtt
        ports:
          http:
            port: 8080
    persistence:
      config:
        existingClaim: zigbee2mqtt-config
        globalMounts:
          - path: /config
      # TODO: replace with the coordinator's /dev/serial/by-id path, set the
      # controller replicas to 1, and add a nodeSelector for the node with the
      # dongle.
      usb:
        type: hostPath
        hostPath: /dev/serial/by-id/REPLACE_WITH_COORDINATOR-if00-port0
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/ttyUSB0
