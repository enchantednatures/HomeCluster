# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/persistentvolumeclaim.json
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lancache-cache
  namespace: lancache
  labels:
    app.kubernetes.io/name: lancache
    app.kubernetes.io/instance: lancache
  annotations:
    # Kept after migration until the new economy-backed cache has served traffic.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lancache-cache-economy
  namespace: lancache
  labels:
    app.kubernetes.io/name: lancache
    app.kubernetes.io/instance: lancache
spec:
  storageClassName: ceph-block-economy
  volumeName: lancache-cache-economy
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Ti
