# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kiali
spec:
  maxHistory: 2
  interval: 30m
  chart:
    spec:
      chart: kiali-server
      version: 2.32.0 # datasource=helm depName=kiali-server repository=https://kiali.org/helm-charts
      sourceRef:
        kind: HelmRepository
        name: kiali
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    auth:
      strategy: anonymous
    server:
      port: 20001
      web_root: /kiali
    external_services:
      prometheus:
        url: http://prometheus-operated.monitoring.svc.cluster.local:9090
      grafana:
        enabled: true
        internal_url: http://grafana.monitoring.svc.cluster.local:80
        external_url: https://grafana.${SECRET_DOMAIN}
      tracing:
        enabled: true
        internal_url: http://tempo-query-frontend.monitoring.svc.cluster.local:3200
        external_url: https://tempo.${SECRET_DOMAIN}
    istio_namespace: istio-system
    deployment:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
