# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sparkyfitness
spec:
  driftDetection:
    mode: enabled
  maxHistory: 2
  interval: 30m
  chart:
    spec:
      chart: sparkyfitness
      version: 1.11.0 # datasource=helm depName=sparkyfitness repository=oci://ghcr.io/codewithcj/charts
      sourceRef:
        kind: HelmRepository
        name: sparkyfitness
        namespace: flux-system
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      storageClass: ceph-block
    config:
      timezone: ${TIMEZONE}
      frontendUrl: https://sparkyfitness.${SECRET_DOMAIN}
      oidc:
        enabled: true
        providerSlug: authentik
        providerName: Authentik
        issuerUrl: https://auth.${SECRET_DOMAIN}/application/o/sparkyfitness/
        scope: openid email profile offline_access
        autoRegister: true
        secrets:
          existingSecret: sparkyfitness-oidc
    postgresql:
      enabled: false
    externalDatabase:
      host: sparkyfitness-db-rw.sparkyfitness.svc.cluster.local
      port: 5432
      database: sparkyfitness
      auth:
        existingSecret: sparkyfitness-db-owner
    server:
      secrets:
        generate: false
        existingSecret: sparkyfitness-app
      appDatabase:
        existingSecret: sparkyfitness-appdb
      persistence:
        uploads:
          existingClaim: sparkyfitness-uploads
        backup:
          existingClaim: sparkyfitness-backup
