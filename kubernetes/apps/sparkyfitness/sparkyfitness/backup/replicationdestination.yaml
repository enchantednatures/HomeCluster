# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationdestination_v1alpha1.json
# https://volsync.readthedocs.io/en/stable/usage/restic/index.html
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: sparkyfitness-restore
  namespace: sparkyfitness
spec:
  # VolSync 0.17 does not honor `paused` for a restic destination, so this
  # resource restores once on creation. It therefore targets a dedicated
  # drill PVC instead of the live `sparkyfitness-uploads` volume, which
  # would otherwise be overwritten by the latest snapshot.
  # Trigger restore drills by patching spec.trigger.manual.
  paused: true
  trigger:
    manual: ""
  restic:
    repository: sparkyfitness-backup-secret
    copyMethod: Direct
    destinationPVC: sparkyfitness-uploads-restore
    capacity: 10Gi
    cacheStorageClassName: ceph-block-economy
    cacheCapacity: 10Gi
