# yaml-language-server: $schema=https://raw.githubusercontent.com/grafana/k6-operator/main/config/crd/bases/k6.io_testruns.yaml
---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: k6-smoke
  namespace: testing
spec:
  parallelism: 1
  paused: "false"
  arguments: "-o experimental-prometheus-rw --tag testid=smoke"
  initializer:
    image: grafana/k6:2.3.0
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
  script:
    configMap:
      name: k6-scripts
      file: smoke.js
  runner:
    image: grafana/k6:2.3.0
    env:
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
      - name: K6_PROMETHEUS_RW_TREND_STATS
        value: "p(95),p(99),avg,min,max"
      - name: K6_PROMETHEUS_RW_STALE_MARKERS
        value: "true"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
