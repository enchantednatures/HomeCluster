# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/k8s/job-v1.json
---
apiVersion: batch/v1
kind: Job
metadata:
  name: &app lakekeeper-bootstrap-v7
  namespace: lakehouse
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      restartPolicy: OnFailure
      serviceAccountName: lakekeeper
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: bootstrap
          image: nginx:1.27-alpine
          envFrom:
            - secretRef:
                name: lakekeeper-minio-credentials
          command:
            - /bin/sh
            - -c
            - |
              set -o errexit
              API=http://lakekeeper.lakehouse.svc.cluster.local:8181
              i=0
              until nc -z -w 2 lakekeeper.lakehouse.svc.cluster.local 8181; do
                i=$((i + 1))
                if [ "$i" -gt 60 ]; then echo "lakekeeper not reachable after 5m"; exit 1; fi
                sleep 5
              done
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              AUTH="Authorization: Bearer $${TOKEN}"

              STATUS="$(wget -S -O /dev/null \
                --header "$${AUTH}" \
                --header "Content-Type: application/json" \
                --post-data '{"accept-terms-of-use":true}' \
                "$${API}/management/v1/bootstrap" 2>&1 | grep -o 'HTTP/[0-9.]* [0-9][0-9][0-9]' | tail -n1 | awk '{print $NF}')" || true
              echo "bootstrap status: $${STATUS}"
              case "$${STATUS}" in
                200|201|409) ;;
                # 400 = CatalogAlreadyBootstrapped (idempotent re-run)
                400) echo "already bootstrapped" ;;
                *) echo "bootstrap failed unexpectedly"; exit 1 ;;
              esac

              wget --header "$${AUTH}" -O /tmp/warehouses.json \
                "$${API}/management/v1/warehouse" 2>/dev/null
              if grep -q '"name":"lakehouse"' /tmp/warehouses.json; then
                echo "warehouse lakehouse already exists"
                exit 0
              fi

              echo "{\"warehouse-name\":\"lakehouse\",\"delete-profile\":{\"type\":\"hard\"},\"storage-credential\":{\"type\":\"s3\",\"credential-type\":\"access-key\",\"aws-access-key-id\":\"$${MINIO_ACCESS_KEY}\",\"aws-secret-access-key\":\"$${MINIO_SECRET_KEY}\"},\"storage-profile\":{\"type\":\"s3\",\"bucket\":\"lakehouse-warehouse\",\"region\":\"us-east-1\",\"sts-enabled\":false,\"flavor\":\"s3-compat\",\"key-prefix\":\"lakehouse-warehouse\",\"endpoint\":\"http://minio-service.networking.svc.cluster.local:9768\",\"path-style-access\":true}}" > /tmp/warehouse.json

              STATUS="$(wget -S -O /dev/null \
                --header "$${AUTH}" \
                --header "Content-Type: application/json" \
                --post-data "$(cat /tmp/warehouse.json)" \
                "$${API}/management/v1/warehouse" 2>&1 | grep -o 'HTTP/[0-9.]* [0-9][0-9][0-9]' | tail -n1 | awk '{print $NF}')" || true
              echo "warehouse create status: $${STATUS}"
              case "$${STATUS}" in
                200|201|409) ;;
                *) echo "warehouse creation failed unexpectedly"; exit 1 ;;
              esac
