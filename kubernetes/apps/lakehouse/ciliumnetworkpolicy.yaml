# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-node-egress
  namespace: lakehouse
spec:
  endpointSelector: {}
  egress:
    # Kubernetes API access (CNPG instance manager and any pod that needs the API;
    # the allow-all NetworkPolicy excludes the service CIDR and vanilla NetworkPolicy
    # ipBlock rules do not match node identity, must use entities — kiali precedent)
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
