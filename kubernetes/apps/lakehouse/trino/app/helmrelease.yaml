# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trino
  namespace: lakehouse
spec:
  maxHistory: 2
  interval: 30m
  chart:
    spec:
      chart: trino
      version: 1.42.2 # datasource=helm depName=trino repository=https://trinodb.github.io/charts/
      sourceRef:
        kind: HelmRepository
        name: trino
        namespace: flux-system
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    server:
      workers: 0
      config:
        query:
          maxMemory: 2GB
      exchange:
        compression: enabled
    coordinator:
      labels:
        # melusine ztunnel crash-loops and breaks ambient kubelet probes — mesh-exclude like CNPG
        istio.io/dataplane-mode: none
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - work-00
                      - work-01
                      - work-02
      config:
        query:
          maxMemoryPerNode: 512MB
        nodeScheduler:
          includeCoordinator: true
      jvm:
        maxHeapSize: null
        maxHeapPercent: 70
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
    catalogs:
      lakekeeper: |
        connector.name=iceberg
        iceberg.catalog.type=rest
        iceberg.rest-catalog.uri=http://lakekeeper.lakehouse.svc.cluster.local:8181/catalog
        iceberg.rest-catalog.security=OAUTH2
        # k8s ServiceAccount token (SA lakekeeper, 1y bound token) from cluster-secrets
        iceberg.rest-catalog.oauth2.token=${LAKEKEEPER_SA_TOKEN}
        iceberg.rest-catalog.oauth2.token-refresh-enabled=false
        iceberg.rest-catalog.warehouse=lakehouse
        iceberg.rest-catalog.nested-namespace-enabled=true
        iceberg.rest-catalog.vended-credentials-enabled=false
        iceberg.unique-table-location=true
        fs.native-s3.enabled=true
        s3.region=us-east-1
        s3.endpoint=http://minio-service.networking.svc.cluster.local:9768
        s3.path-style-access=true
        s3.aws-access-key=${MINIO_ACCESS_KEY}
        s3.aws-secret-key=${MINIO_SECRET_KEY}
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
