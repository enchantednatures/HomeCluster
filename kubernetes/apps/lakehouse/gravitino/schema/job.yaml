# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/k8s/job-v1.json
---
apiVersion: batch/v1
kind: Job
metadata:
  name: &app gravitino-schema-v1
  namespace: lakehouse
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
        istio.io/dataplane-mode: none
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: scripts
          image: apache/gravitino:1.3.1 # datasource=docker depName=apache/gravitino
          command:
            - /bin/bash
            - -c
            - cp -r /opt/gravitino/scripts/postgresql /scripts/
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      containers:
        - name: schema
          image: ghcr.io/cloudnative-pg/postgresql:16.9-22 # datasource=docker depName=ghcr.io/cloudnative-pg/postgresql versioning=redhat
          command:
            - /bin/bash
            - -c
            - |
              set -o errexit -o pipefail

              i=0
              until pg_isready -h "$${PGHOST}" -p 5432 -U "$${PGUSER}" -d "$${PGDATABASE}" >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -gt 60 ]; then
                  echo "gravitino-db not ready after 5m" >&2
                  exit 1
                fi
                sleep 5
              done

              psql -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS gravitino;"
              psql -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS lakehouse;"

              SCHEMA_FILE="$(ls /scripts/postgresql/schema-*-postgresql.sql | sort -V | tail -n 1)"
              echo "Applying schema file: $${SCHEMA_FILE}"
              PGOPTIONS="-c search_path=gravitino" psql -v ON_ERROR_STOP=1 -f "$${SCHEMA_FILE}"
          env:
            - name: PGHOST
              value: gravitino-db-rw.lakehouse.svc.cluster.local
            - name: PGDATABASE
              value: gravitino
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: gravitino-db-user
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: gravitino-db-user
                  key: password
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          emptyDir: {}
