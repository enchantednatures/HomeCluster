# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/k8s/job-v1.json
---
apiVersion: batch/v1
kind: Job
metadata:
  name: &app gravitino-bootstrap-v2
  namespace: lakehouse
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
        istio.io/dataplane-mode: none
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
      containers:
        - name: bootstrap
          image: curlimages/curl:8.22.0 # datasource=docker depName=curlimages/curl
          command:
            - /bin/sh
            - -c
            - |
              set -o errexit

              AWS_ACCESS_KEY_ID="$(cat /warehouse/secret/AWS_ACCESS_KEY_ID)"
              AWS_SECRET_ACCESS_KEY="$(cat /warehouse/secret/AWS_SECRET_ACCESS_KEY)"
              BUCKET_NAME="$(cat /warehouse/config/BUCKET_NAME)"
              BUCKET_HOST="$(cat /warehouse/config/BUCKET_HOST)"
              BUCKET_PORT="$(cat /warehouse/config/BUCKET_PORT)"
              if [ -z "$${BUCKET_PORT}" ]; then BUCKET_PORT=80; fi

              API=http://gravitino.lakehouse.svc.cluster.local:8090

              i=0
              until curl -fsS "$${API}/health/ready" >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -gt 60 ]; then
                  echo "gravitino not ready after 5m" >&2
                  exit 1
                fi
                sleep 5
              done

              ACCEPT='Accept: application/vnd.gravitino.v1+json'

              curl -fsS -H "$${ACCEPT}" "$${API}/api/metalakes" -o /tmp/metalakes.json
              if grep -q 'lakehouse' /tmp/metalakes.json; then
                echo "metalake lakehouse already exists"
              else
                HTTP_CODE="$(curl -sS -o /tmp/metalake-resp.json -w '%{http_code}' \
                  -X POST \
                  -H "$${ACCEPT}" \
                  -H 'Content-Type: application/json' \
                  --data '{"name":"lakehouse","comment":"HomeCluster lakehouse metalake","properties":{}}' \
                  "$${API}/api/metalakes")"
                echo "metalake create status: $${HTTP_CODE}"
                case "$${HTTP_CODE}" in
                  200|201)
                    if ! grep -Eq '"code"[[:space:]]*:[[:space:]]*0' /tmp/metalake-resp.json; then
                      echo "metalake creation returned a non-zero code" >&2
                      cat /tmp/metalake-resp.json >&2
                      exit 1
                    fi
                    ;;
                  409)
                    echo "metalake already exists"
                    ;;
                  *)
                    echo "metalake creation failed" >&2
                    cat /tmp/metalake-resp.json >&2
                    exit 1
                    ;;
                esac
              fi

              curl -fsS -H "$${ACCEPT}" "$${API}/api/metalakes/lakehouse/catalogs" -o /tmp/catalogs.json
              if grep -q 'lakehouse' /tmp/catalogs.json; then
                echo "catalog lakehouse already exists"
                exit 0
              fi

              cat > /tmp/catalog.json <<EOF
              {
                "name": "lakehouse",
                "type": "RELATIONAL",
                "provider": "lakehouse-iceberg",
                "comment": "S3 lakehouse warehouse on Rook-Ceph RGW",
                "properties": {
                  "catalog-backend": "jdbc",
                  "uri": "jdbc:postgresql://gravitino-db-rw.lakehouse.svc.cluster.local:5432/gravitino?currentSchema=lakehouse",
                  "jdbc-user": "$${PGUSER}",
                  "jdbc-password": "$${PGPASSWORD}",
                  "jdbc-driver": "org.postgresql.Driver",
                  "warehouse": "s3://$${BUCKET_NAME}/",
                  "io-impl": "org.apache.iceberg.aws.s3.S3FileIO",
                  "s3-endpoint": "http://$${BUCKET_HOST}:$${BUCKET_PORT}",
                  "s3-access-key-id": "$${AWS_ACCESS_KEY_ID}",
                  "s3-secret-access-key": "$${AWS_SECRET_ACCESS_KEY}",
                  "s3-region": "us-east-1",
                  "s3-path-style-access": "true"
                }
              }
              EOF

              HTTP_CODE="$(curl -sS -o /tmp/catalog-resp.json -w '%{http_code}' \
                -X POST \
                -H "$${ACCEPT}" \
                -H 'Content-Type: application/json' \
                --data @/tmp/catalog.json \
                "$${API}/api/metalakes/lakehouse/catalogs")"
                echo "catalog create status: $${HTTP_CODE}"
                case "$${HTTP_CODE}" in
                  200|201)
                    if ! grep -Eq '"code"[[:space:]]*:[[:space:]]*0' /tmp/catalog-resp.json; then
                      echo "catalog creation returned a non-zero code" >&2
                      cat /tmp/catalog-resp.json >&2
                      exit 1
                    fi
                    ;;
                  409)
                    echo "catalog already exists"
                    ;;
                  *)
                    echo "catalog creation failed" >&2
                    cat /tmp/catalog-resp.json >&2
                    exit 1
                    ;;
                esac
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: gravitino-db-user
                  key: postgresql-user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: gravitino-db-user
                  key: postgresql-password
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: warehouse-secret
              mountPath: /warehouse/secret
              readOnly: true
            - name: warehouse-config
              mountPath: /warehouse/config
              readOnly: true
      volumes:
        - name: warehouse-secret
          secret:
            secretName: lakehouse-warehouse
        - name: warehouse-config
          configMap:
            name: lakehouse-warehouse
