# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.k8s.io/ingress_v1.json
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: &app knectd-tailscale
  namespace: knect
  labels:
    app.kubernetes.io/name: &name knectd
    app.kubernetes.io/instance: *name
  annotations:
    tailscale.com/hostname: knect
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: knectd
      port:
        number: 7420
