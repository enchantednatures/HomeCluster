# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: knectd
spec:
  driftDetection:
    mode: enabled
  maxHistory: 2
  interval: 30m
  chart:
    spec:
      chart: knectd
      version: 1.1.0 # datasource=helm depName=knectd repository=oci://ghcr.io/enchantednatures/charts
      sourceRef:
        kind: HelmRepository
        name: enchantednatures
        namespace: flux-system
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 4Gi
    probes:
      startup:
        failureThreshold: 60
    cache:
      # The redb snapshot is mmap'd and pushes the cgroup over smaller limits;
      # the daemon rebuilds from watches on start, so persistence is optional.
      enabled: false
    rbac:
      # The daemon watches every discovered API resource. The chart's curated
      # ClusterRole predates several CRDs in these operator groups; grant
      # read-only access so watchers do not log 403s and retry forever.
      extraRules:
        - apiGroups:
            - ""
          resources:
            - podtemplates
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - apps
          resources:
            - controllerrevisions
          verbs:
            - get
            - list
            - watch
        - apiGroups:
            - ceph.rook.io
            - cluster.redpanda.com
            - kafka.strimzi.io
            - kyverno.io
            - postgresql.cnpg.io
          resources:
            - "*"
          verbs:
            - get
            - list
            - watch
    tap:
      enabled: true
      service:
        enabled: true
      # Stable in-cluster callback for Knative eventing Triggers.
      callbackHost: knectd-tap.knect.svc.cluster.local
