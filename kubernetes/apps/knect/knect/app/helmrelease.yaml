# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: knectd
spec:
  driftDetection:
    mode: enabled
  maxHistory: 2
  interval: 30m
  chart:
    spec:
      chart: knectd
      version: 1.0.1 # datasource=helm depName=knectd repository=oci://ghcr.io/enchantednatures/charts
      sourceRef:
        kind: HelmRepository
        name: enchantednatures
        namespace: flux-system
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    tap:
      enabled: true
      service:
        enabled: true
      # Stable in-cluster callback for Knative eventing Triggers.
      callbackHost: knectd-tap.knect.svc.cluster.local
