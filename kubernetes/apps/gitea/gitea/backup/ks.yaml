# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gitea-backup
  namespace: flux-system
spec:
  targetNamespace: gitea
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # Do not add a gitea dependency: the gitea HelmRelease can be Failed
    # independently (app crashloop) and would block backup reconciliation.
    # The gitea-data PVC exists regardless of app health.
    - name: volsync
      namespace: flux-system
  path: ./kubernetes/apps/gitea/gitea/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
