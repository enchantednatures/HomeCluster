# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationdestination_v1alpha1.json
# https://volsync.readthedocs.io/en/stable/usage/restic/index.html
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: gitea-restore
  namespace: gitea
spec:
  # Paused by default: Flux reconciles the manifest; trigger manually via
  # kubectl patch on spec.trigger.manual for restore drills
  paused: true
  trigger:
    manual: ""
  restic:
    repository: gitea-backup-secret
    copyMethod: Direct
    destinationPVC: gitea-data
    cacheStorageClassName: csi-nfs
    cacheCapacity: 10Gi
    # Mover runs as gitea uid/gid 1000 so restored files stay gitea-readable
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    # Kyverno require-pod-resources (gitea ns is not excluded) mandates
    # requests cpu+memory and limits memory on the mover container
    moverResources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
