# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/pooler_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: immich-db-pooler-rw
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-db
spec:
  template:
    metadata:
      labels:
        istio.io/dataplane-mode: "none"
  cluster:
    name: immich-db
  instances: 1
  type: rw
  pgbouncer:
    # Immich uses session-level pg_advisory_lock for migrations. Under
    # transaction pooling the lock and its unlock can land on different
    # server connections, leaking the lock and wedging startup until the
    # backend is killed. Session mode keeps them on the same connection.
    poolMode: session
    parameters:
      max_client_conn: "1000"
      default_pool_size: "25"
      min_pool_size: "5"
      reserve_pool_size: "5"
  monitoring:
    enablePodMonitor: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/pooler_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: immich-db-pooler-ro
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-db
spec:
  template:
    metadata:
      labels:
        istio.io/dataplane-mode: "none"
  cluster:
    name: immich-db
  instances: 1
  type: ro
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "1000"
      default_pool_size: "25"
      min_pool_size: "5"
      reserve_pool_size: "5"
  monitoring:
    enablePodMonitor: false
