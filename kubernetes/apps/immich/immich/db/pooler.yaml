# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/pooler_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: immich-db-pooler-rw
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-db
spec:
  template:
    metadata:
      labels:
        istio.io/dataplane-mode: "none"
  cluster:
    name: immich-db
  instances: 3
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "25"
      min_pool_size: "5"
      reserve_pool_size: "5"
  monitoring:
    enablePodMonitor: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/pooler_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: immich-db-pooler-ro
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-db
spec:
  template:
    metadata:
      labels:
        istio.io/dataplane-mode: "none"
  cluster:
    name: immich-db
  instances: 3
  type: ro
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "1000"
      default_pool_size: "25"
      min_pool_size: "5"
      reserve_pool_size: "5"
  monitoring:
    enablePodMonitor: false
