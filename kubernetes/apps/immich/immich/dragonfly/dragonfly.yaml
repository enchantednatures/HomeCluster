# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/dragonflydb.io/dragonfly_v1alpha1.json
---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
spec:
  # Single instance: BullMQ undeclared-key errors only occur with replication enabled
  # https://github.com/dragonflydb/dragonfly/issues/2598
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: 600m
      memory: 750Mi
