# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.k8s.io/ingress_v1.json
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-android-tailscale
  namespace: android-emulator
  labels:
    app.kubernetes.io/name: docker-android
    app.kubernetes.io/instance: docker-android
  annotations:
    tailscale.com/hostname: android-emulator
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: docker-android
      port:
        number: 6080
