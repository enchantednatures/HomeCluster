# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationsource_v1alpha1.json
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: docker-android-backup
  namespace: android-emulator
spec:
  sourcePVC: docker-android-data
  trigger:
    schedule: "50 2 * * *"
  restic:
    repository: docker-android-backup-secret
    copyMethod: Direct
    # docker-android runs as uid 1300 / gid 1301 and keeps adbkey (0600)
    # and avd/running (0700) owner-only. The mover defaults to uid 65532,
    # which cannot read them and restic exits non-zero forever.
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 1300
      runAsGroup: 1301
      fsGroup: 1301
    moverResources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    retain:
      daily: 7
      weekly: 4
      monthly: 12
    pruneIntervalDays: 7
    storageClassName: ceph-block
    cacheStorageClassName: ceph-block
    cacheCapacity: 10Gi
    moverPodLabels:
      app: volsync-docker-android-backup
