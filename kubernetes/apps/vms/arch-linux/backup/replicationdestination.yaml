# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationdestination_v1alpha1.json
# https://volsync.readthedocs.io/en/stable/usage/restic/index.html
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: arch-linux-restore
  namespace: vms
spec:
  # Paused by default: Flux reconciles the manifest; trigger manually via
  # kubectl patch on spec.trigger.manual for restore drills
  paused: true
  trigger:
    manual: ""
  restic:
    repository: arch-linux-backup-secret
    copyMethod: Direct
    destinationPVC: arch-linux-root
    cacheStorageClassName: openebs-hostpath
    cacheCapacity: 10Gi
    # Mover runs as qemu uid/gid 107 so restored disk.img stays qemu-readable
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 107
      runAsGroup: 107
      fsGroup: 107
