# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gpu-test
  namespace: flux-system
spec:
  targetNamespace: vms
  dependsOn:
    - name: kubevirt-operator
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: gpu-test
  path: ./kubernetes/apps/vms/gpu-test/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
