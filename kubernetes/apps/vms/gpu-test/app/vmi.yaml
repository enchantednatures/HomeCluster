---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: gpu-passthrough-test
  namespace: vms
  labels:
    app.kubernetes.io/name: gpu-passthrough-test
    app.kubernetes.io/instance: gpu-passthrough-test
    kubevirt.io/domain: gpu-passthrough-test
spec:
  terminationGracePeriodSeconds: 0
  nodeSelector:
    kubernetes.io/hostname: gateway-1
  domain:
    cpu:
      cores: 2
      sockets: 1
      threads: 1
    memory:
      guest: 2Gi
    machine:
      type: q35
    firmware:
      bootloader:
        bios: {}
    features:
      acpi: {}
    devices:
      disks:
        - name: containerdisk
          disk:
            bus: virtio
      gpus:
        - deviceName: nvidia.com/RTX3080
          name: gpu0
      hostDevices:
        - deviceName: nvidia.com/RTX3080_AUDIO
          name: gpu0-audio
      interfaces:
        - name: default
          masquerade: {}
      rng: {}
    resources:
      requests:
        cpu: 2
        memory: 2Gi
  networks:
    - name: default
      pod: {}
  volumes:
    - name: containerdisk
      containerDisk:
        image: quay.io/kubevirt/cirros-container-disk-demo:latest
