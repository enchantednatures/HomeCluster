---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: rusalka
  namespace: vms
  labels:
    app.kubernetes.io/name: rusalka
    app.kubernetes.io/instance: rusalka
    kubevirt.io/domain: rusalka
    kubevirt.io/vm: rusalka
spec:
  # The RTX 3080 was moved from this VM to Ollama on the host. Keep the VM
  # halted until the GPU is handed back; it also has no display device without
  # the passthrough card.
  runStrategy: Halted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rusalka
        app.kubernetes.io/instance: rusalka
        kubevirt.io/domain: rusalka
        kubevirt.io/vm: rusalka
    spec:
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: gateway-1
      domain:
        cpu:
          cores: 8
          sockets: 1
          threads: 1
        memory:
          # Temporarily 10Gi: gateway-1 has ~12.9Gi of schedulable memory with
          # the current workload set, and the launcher adds ~1.3Gi overhead.
          # Restore to 16Gi after the install and after freeing node capacity.
          guest: 10Gi
        machine:
          type: pc-q35-rhel9.2.0
        firmware:
          # Keep the existing Arch UEFI boot configuration. With the GPU
          # removed, VNC uses the emulated display instead of the RTX 3080.
          bootloader:
            efi:
              secureBoot: false
        features:
          acpi: {}
        devices:
          # The RTX 3080 and its audio function now belong to the host Ollama
          # workload. Restore them here together with the Talos
          # PCIDriverRebindConfig documents and the KubeVirt permittedHostDevices
          # entries if the VM should get the GPU back. Until then the VM stays
          # halted and uses the emulated display when started.
          autoattachGraphicsDevice: true
          # The existing Omarchy install lives on the passed-through Samsung
          # NVMe, so no KubeVirt disks are attached while we validate it.
          # Re-add omarchy-iso/rusalka-root from Git history if needed.
          # The dock's Fresco USB controller is passed through. The
          # Thunderbolt bridge itself cannot bind to vfio-pci, so it is left
          # unbound on the host; only the USB controller is assigned.
          hostDevices:
            - deviceName: usb/intel-xhci
              name: usb0
            - deviceName: nvme/samsung-970
              name: nvme0
            - deviceName: usb/fresco-xhci
              name: usb1
          interfaces:
            # The guest's cloud-init-generated network config matches this stable
            # MAC. KubeVirt otherwise assigns a new random pod MAC on every VMI
            # recreation and the guest network never comes up.
            - name: default
              masquerade: {}
              macAddress: "f2:5a:1c:9e:00:01"
          networkInterfaceMultiqueue: true
          rng: {}
        resources:
          requests:
            cpu: 4
            # Track the temporary 10Gi guest above.
            memory: 10Gi
          limits:
            cpu: 8
            memory: 12Gi
      networks:
        - name: default
          pod: {}
