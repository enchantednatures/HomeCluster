---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: rusalka
  namespace: vms
  labels:
    app.kubernetes.io/name: rusalka
    app.kubernetes.io/instance: rusalka
    kubevirt.io/domain: rusalka
    kubevirt.io/vm: rusalka
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rusalka
        app.kubernetes.io/instance: rusalka
        kubevirt.io/domain: rusalka
        kubevirt.io/vm: rusalka
    spec:
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: gateway-1
      domain:
        cpu:
          cores: 8
          sockets: 1
          threads: 1
        memory:
          # Temporarily 10Gi: gateway-1 has ~12.9Gi of schedulable memory with
          # the current workload set, and the launcher adds ~1.3Gi overhead.
          # Restore to 16Gi after the install and after freeing node capacity.
          guest: 10Gi
        machine:
          type: pc-q35-rhel9.2.0
        firmware:
          # UEFI is required when the passthrough GPU is the only display;
          # SeaBIOS does not reach the boot device without a VGA device.
          bootloader:
            efi:
              secureBoot: false
        features:
          acpi: {}
        devices:
          # The RTX 3080 is the workstation's only display. Without this,
          # KubeVirt attaches an emulated VGA as primary and the GPU scans out
          # an empty framebuffer, so a monitor on the card stays black.
          autoattachGraphicsDevice: false
          disks:
            - name: omarchy-iso
              cdrom:
                bus: sata
              bootOrder: 1
            - name: rusalka-root
              disk:
                bus: virtio
              bootOrder: 2
          gpus:
            - deviceName: nvidia.com/RTX3080
              name: gpu0
          hostDevices:
            - deviceName: nvidia.com/RTX3080_AUDIO
              name: gpu0-audio
            - deviceName: usb/intel-xhci
              name: usb0
            # The dock's Fresco controller is temporarily detached while
            # Omarchy is installed: with it present, the RTX 3080 moves to
            # guest bus 0c and its hostdev flaps. Re-add usb1/fresco-xhci
            # after the NVIDIA driver is installed.
            # - deviceName: usb/fresco-xhci
            #   name: usb1
          interfaces:
            # The guest's cloud-init-generated network config matches this stable
            # MAC. KubeVirt otherwise assigns a new random pod MAC on every VMI
            # recreation and the guest network never comes up.
            - name: default
              masquerade: {}
              macAddress: "f2:5a:1c:9e:00:01"
          networkInterfaceMultiqueue: true
          rng: {}
        resources:
          requests:
            cpu: 4
            # Track the temporary 10Gi guest above.
            memory: 10Gi
          limits:
            cpu: 8
            memory: 12Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: omarchy-iso
          dataVolume:
            name: omarchy-iso
        - name: rusalka-root
          dataVolume:
            name: rusalka-root
