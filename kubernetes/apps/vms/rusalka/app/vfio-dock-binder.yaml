# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps/v1/daemonset.json
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vfio-dock-binder
  labels:
    app.kubernetes.io/name: vfio-dock-binder
    app.kubernetes.io/instance: rusalka
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vfio-dock-binder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vfio-dock-binder
        app.kubernetes.io/instance: rusalka
    spec:
      nodeSelector:
        kubernetes.io/hostname: gateway-1
      automountServiceAccountToken: false
      containers:
        - name: binder
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            # Two host devices are kept on vfio-pci:
            #   - the Thunderbolt dock's Fresco USB controller, which can
            #     enumerate after the boot-time rebind controller has run;
            #   - the Samsung 970 EVO at 0000:01:00.0, dedicated to the VM.
            # The NVMe is matched by exact address because the identical
            # 970 EVO at 0000:02:00.0 is the Talos system disk.
            - |
              set -u
              last=""
              log() { echo "$(date -u +%FT%TZ) $*"; }
              is_target() {
                dev=$1
                id=$(basename "$dev")
                vendor=$(cat "$dev/vendor" 2>/dev/null)
                device=$(cat "$dev/device" 2>/dev/null)
                if [ "$vendor" = "0x1b73" ] && [ "$device" = "0x1100" ]; then
                  return 0
                fi
                if [ "$id" = "0000:01:00.0" ] && [ "$vendor" = "0x144d" ] && [ "$device" = "0xa808" ]; then
                  return 0
                fi
                return 1
              }
              while true; do
                state=""
                for dev in /sys/bus/pci/devices/*; do
                  is_target "$dev" || continue
                  id=$(basename "$dev")
                  driver=$(basename "$(readlink "$dev/driver" 2>/dev/null)" 2>/dev/null)
                  if [ "$driver" != "vfio-pci" ]; then
                    if [ -n "$driver" ]; then
                      echo "$id" > "$dev/driver/unbind" 2>/dev/null || true
                    fi
                    printf '%s' vfio-pci > "$dev/driver_override" 2>/dev/null || true
                    echo "$id" > /sys/bus/pci/drivers/vfio-pci/bind 2>/dev/null || true
                    sleep 1
                    driver=$(basename "$(readlink "$dev/driver" 2>/dev/null)" 2>/dev/null)
                  fi
                  if [ -z "$driver" ]; then
                    driver="none"
                  fi
                  state="$state $id=$driver"
                done
                if [ -z "$state" ]; then
                  state=" none"
                fi
                if [ "$state" != "$last" ]; then
                  log "targets:$state"
                  last="$state"
                fi
                sleep 5
              done
          securityContext:
            privileged: true
          volumeMounts:
            - name: sys
              mountPath: /sys
      volumes:
        - name: sys
          hostPath:
            path: /sys
