---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/service.json
apiVersion: v1
kind: Service
metadata:
  name: rusalka-ssh
  namespace: vms
  labels:
    app.kubernetes.io/name: rusalka-ssh
    app.kubernetes.io/instance: rusalka
  annotations:
    tailscale.com/hostname: rusalka
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    kubevirt.io/domain: rusalka
  ports:
    - name: ssh
      port: 22
      protocol: TCP
      targetPort: 22
