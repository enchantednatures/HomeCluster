# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rusalka
  namespace: flux-system
spec:
  targetNamespace: vms
  dependsOn:
    - name: arch-vm
    - name: gaming
    - name: kubevirt-cdi
    - name: kubevirt-operator
    - name: rook-ceph-cluster
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: rusalka
  path: ./kubernetes/apps/vms/rusalka/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
