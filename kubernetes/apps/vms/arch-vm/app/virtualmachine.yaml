---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: austin-vm
  namespace: vms
  labels:
    app.kubernetes.io/name: austin-vm
    app.kubernetes.io/instance: austin-vm
    kubevirt.io/domain: austin-vm
    kubevirt.io/vm: austin-vm
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: austin-vm
        app.kubernetes.io/instance: austin-vm
        kubevirt.io/domain: austin-vm
        kubevirt.io/vm: austin-vm
    spec:
      terminationGracePeriodSeconds: 0
      domain:
        cpu:
          cores: 4
          sockets: 1
          threads: 1
        memory:
          guest: 8Gi
        machine:
          type: pc-q35-rhel9.2.0
        firmware:
          bootloader:
            bios: {}
        features:
          acpi: {}
        devices:
          disks:
            - name: austin-vm-root
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
          networkInterfaceMultiqueue: true
          rng: {}
        resources:
          requests:
            cpu: 2
            memory: 8Gi
          limits:
            cpu: 4
            memory: 9Gi
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: austin-ssh-key
            propagationMethod:
              qemuGuestAgent:
                users:
                  - austin
      networks:
        - name: default
          pod: {}
      volumes:
        - name: austin-vm-root
          dataVolume:
            name: austin-vm-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: austin-vm-cloud-init
