# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app blocky
  namespace: dns
spec:
  driftDetection:
    mode: enabled
  maxHistory: 2
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3 # datasource=helm depName=app-template repository=oci://ghcr.io/bjw-s
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/arch: amd64

    controllers:
      blocky:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
        containers:
          app:
            image:
              repository: ghcr.io/0xerr0r/blocky
              # datasource=docker depName=0xERR0R/blocky registry=https://ghcr.io
              tag: v0.36.0@sha256:652ecbd98a73238599b0ee5fe90f498c37b556550b15c6669d6127871be9fbaf
            args:
              - --config
              - /app/config.yml
            ports:
              - name: dns-udp
                containerPort: 53
                protocol: UDP
              - name: dns-tcp
                containerPort: 53
                protocol: TCP
              - name: http
                containerPort: &http-port 4000
                protocol: TCP
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 53
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      dns:
        controller: blocky
        type: LoadBalancer
        loadBalancerIP: 192.168.1.254
        ports:
          dns-udp:
            port: 53
            protocol: UDP
            primary: true
          dns-tcp:
            port: 53
            protocol: TCP
          http:
            port: *http-port

    persistence:
      config:
        type: configMap
        name: blocky-config
        advancedMounts:
          blocky:
            app:
              - path: /app/config.yml
                subPath: config.yml
