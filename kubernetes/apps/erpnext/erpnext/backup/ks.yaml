# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app erpnext-backup
  namespace: flux-system
spec:
  targetNamespace: erpnext
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: erpnext
    - name: volsync
      namespace: flux-system
  path: ./kubernetes/apps/erpnext/erpnext/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 10m
  retryInterval: 1m
  timeout: 5m
