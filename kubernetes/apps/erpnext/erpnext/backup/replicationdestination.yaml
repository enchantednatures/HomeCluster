# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationdestination_v1alpha1.json
# https://volsync.readthedocs.io/en/stable/usage/restic/index.html
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: erpnext-restore
  namespace: erpnext
spec:
  # Paused by default: Flux reconciles the manifest; trigger manually via
  # kubectl patch on spec.trigger.manual for restore drills
  paused: true
  trigger:
    manual: ""
  restic:
    repository: erpnext-backup-secret
    copyMethod: Direct
    destinationPVC: erpnext-sites
    cacheStorageClassName: ceph-block
    cacheCapacity: 10Gi
    # erpnext-sites is RWX, but the cache PVC lands on ceph-block (RBD, RWO-only);
    # VolSync would derive RWX from the destination PVC, so pin the access mode
    cacheAccessModes:
      - ReadWriteOnce
    # erpnext is not on the Kyverno require-pod-resources namespace exclusion
    # list, so the mover pod must declare CPU/memory requests and a memory limit
    moverResources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # sites volume is owned by uid 1000 and world-readable; restores must write
    # as the app uid, and fsGroup makes empty/fresh restore targets writable
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
