# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/k8s.mariadb.com/backup_v1alpha1.json
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Backup
metadata:
  name: erpnext-db-backup
  namespace: erpnext
spec:
  mariaDbRef:
    name: erpnext-db
    waitForIt: true
  schedule:
    cron: "15 1 * * *"
  maxRetention: 720h
  # Kyverno require-pod-resources denies resource-less backup job pods in this namespace.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    s3:
      bucket: cloudnative-pg
      prefix: erpnext
      # RustFS (plain HTTP, same target as the VolSync and CNPG backups)
      endpoint: rustfs-service.networking.svc.cluster.local:9000
      region: us-east-1
      accessKeyIdSecretKeyRef:
        name: pg-rustfs-backup-secret
        key: aws-access-key-id
      secretAccessKeySecretKeyRef:
        name: pg-rustfs-backup-secret
        key: aws-secret-access-key
