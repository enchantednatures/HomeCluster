# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tandoor-db
  namespace: default
  labels:
    app.kubernetes.io/name: tandoor-db
spec:
  inheritedMetadata:
    labels:
      istio.io/dataplane-mode: "none"
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql versioning=redhat
  imageName: ghcr.io/cloudnative-pg/postgresql:17.1-1
  instances: 3
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: ceph-block-ssd
    resizeInUseVolumes: false
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  enableSuperuserAccess: true
  superuserSecret:
    name: tandoor-postgres-superuser
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 256MB
  monitoring:
    enablePodMonitor: false
  managed:
    roles:
      - name: hunter
        ensure: present
        comment: Hunter
        login: true
        superuser: true
        passwordSecret:
          name: tandoor-db-hunter
        inRoles:
          - pg_monitor
          - pg_signal_backend
      - name: tandoor
        ensure: present
        comment: Tandoor
        login: true
        superuser: false
        passwordSecret:
          name: tandoor-db-user
        inRoles:
          - pg_monitor
          - pg_signal_backend
  bootstrap:
    initdb:
      database: tandoor
      owner: tandoor
      secret:
        name: tandoor-db-user
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS unaccent;
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: minio-store
        serverName: tandoor-v1
