# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.istio.io/virtualservice_v1.json
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: tandoor
  namespace: default
spec:
  hosts:
    - recipes.${SECRET_DOMAIN}
  gateways:
    - istio-ingress/external-gateway
  http:
    - match:
        - uri:
            prefix: /
      # cloudflared reaches the gateway over plain HTTP, so Envoy stamps
      # X-Forwarded-Proto: http and Tandoor builds http:// OIDC redirect URIs,
      # which Authentik rejects (strict https match). Force the scheme here.
      headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: tandoor.default.svc.cluster.local
            port:
              number: 8080
