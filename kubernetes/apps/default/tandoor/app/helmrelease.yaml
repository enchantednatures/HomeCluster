# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tandoor
spec:
  driftDetection:
    mode: enabled
  maxHistory: 2
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3 # datasource=helm depName=app-template repository=oci://ghcr.io/bjw-s/helm
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      tandoor:
        replicas: 2
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: "0%"
          surge: 1
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: tandoor
                  app.kubernetes.io/component: tandoor
        containers:
          app:
            image:
              repository: ghcr.io/tandoorrecipes/recipes
              # datasource=docker depName=ghcr.io/tandoorrecipes/recipes
              tag: 2.7.2
            env:
              TANDOOR_PORT: "8080"
              TZ: ${TIMEZONE}
              DB_ENGINE: django.db.backends.postgresql
              POSTGRES_HOST: tandoor-db-pooler-rw.default.svc.cluster.local
              POSTGRES_PORT: "5432"
              POSTGRES_DB: tandoor
              POSTGRES_USER:
                secretKeyRef:
                  name: tandoor-db-user
                  key: username
              POSTGRES_PASSWORD:
                secretKeyRef:
                  name: tandoor-db-user
                  key: password
              SECRET_KEY:
                secretKeyRef:
                  name: tandoor-secret
                  key: SECRET_KEY
              # SparkyFitness imports recipes over the in-cluster service, which
              # sends the service DNS name as the Host header.
              ALLOWED_HOSTS: recipes.${SECRET_DOMAIN},tandoor.default.svc.cluster.local
              CSRF_TRUSTED_ORIGINS: https://recipes.${SECRET_DOMAIN}
              ENABLE_SIGNUP: "1"
              ACCOUNT_EMAIL_VERIFICATION: "none"
              SOCIALACCOUNT_ONLY: "1"
              SOCIALACCOUNT_EMAIL_VERIFICATION: "none"
              SOCIAL_PROVIDERS: allauth.socialaccount.providers.openid_connect
              SOCIALACCOUNT_PROVIDERS:
                secretKeyRef:
                  name: tandoor-sso
                  key: SOCIALACCOUNT_PROVIDERS
              SOCIALACCOUNT_EMAIL_AUTHENTICATION: "1"
              SOCIALACCOUNT_EMAIL_AUTHENTICATION_AUTO_CONNECT: "1"
              ALLAUTH_TRUSTED_PROXY_COUNT: "2"
              REDIS_HOST: tandoor-dragonfly.default.svc.cluster.local
              REDIS_PORT: "6379"
              # Ollama is an OpenAI-compatible endpoint on the RTX 3080 node.
              # Tandoor blocks custom AI URLs unless they are listed exactly.
              AI_ALLOWED_URLS: http://ollama.ollama.svc.cluster.local:11434/v1
              # AI calls are synchronous; Gemma 3 can take longer than the
              # 30s gunicorn default for vision/PDF recipe imports.
              GUNICORN_TIMEOUT: "180"
              GUNICORN_WORKERS: "5"
              GUNICORN_THREADS: "2"
              DRF_THROTTLE_RECIPE_URL_IMPORT: 6000/hour
              S3_ACCESS_KEY:
                secretKeyRef:
                  name: tandoor-media-bucket
                  key: AWS_ACCESS_KEY_ID
              S3_SECRET_ACCESS_KEY:
                secretKeyRef:
                  name: tandoor-media-bucket
                  key: AWS_SECRET_ACCESS_KEY
              S3_BUCKET_NAME:
                configMapKeyRef:
                  name: tandoor-media-bucket
                  key: BUCKET_NAME
              # Sign against the public endpoint: the browser loads presigned
              # URLs directly, so the signed host must be publicly resolvable.
              S3_ENDPOINT_URL: https://s3.${SECRET_DOMAIN}
              S3_REGION_NAME: us-east-1
              S3_SIGNATURE_VERSION: s3v4
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                    httpHeaders:
                      - name: Host
                        value: recipes.${SECRET_DOMAIN}
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                    httpHeaders:
                      - name: Host
                        value: recipes.${SECRET_DOMAIN}
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                    httpHeaders:
                      - name: Host
                        value: recipes.${SECRET_DOMAIN}
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 6
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
    persistence:
      # Static files are collected per-pod at boot; 97MB of emptyDir is cheaper
      # than a shared RWO volume that blocks a second replica on another node.
      static:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /opt/recipes/staticfiles
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp
