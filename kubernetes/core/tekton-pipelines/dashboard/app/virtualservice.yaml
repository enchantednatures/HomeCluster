# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.istio.io/virtualservice_v1.json
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: tekton-dashboards
  namespace: tekton-pipelines
spec:
  hosts:
    - tekton.${SECRET_DOMAIN}
  gateways:
    - istio-ingress/external-gateway
  http:
    # authentik forward-auth endpoints/static assets on the app host must reach
    # the outpost directly; the gateway ext_authz check handles the rest.
    - match:
        - uri:
            prefix: /outpost.goauthentik.io
      route:
        - destination:
            host: ak-outpost-istio-forward-auth.authentik.svc.cluster.local
            port:
              number: 9000
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: tekton-dashboard.tekton-pipelines.svc.cluster.local
            port:
              number: 9097
