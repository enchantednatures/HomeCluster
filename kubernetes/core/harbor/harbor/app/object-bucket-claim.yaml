# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/objectbucket.io/v1alpha1/objectbucketclaim.json
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  # NB: name must not collide with the chart-owned harbor-registry Secret/ConfigMap.
  name: &app harbor-registry-bucket
  namespace: harbor
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/part-of: harbor
    app.kubernetes.io/component: registry
spec:
  bucketName: harbor-registry
  storageClassName: ceph-bucket-ssd-retain
  additionalConfig:
    bucketOwner: harbor
