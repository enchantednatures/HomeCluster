---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 60m
  chart:
    spec:
      chart: harbor
      version: 1.19.2 # datasource=helm depName=harbor repository=https://helm.goharbor.io
      sourceRef:
        kind: HelmRepository
        name: harbor-charts
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  valuesFrom:
    - kind: Secret
      name: harbor-db
      valuesKey: username
      targetPath: database.external.username
    - kind: Secret
      name: harbor-db
      valuesKey: password
      targetPath: database.external.password
    - kind: ConfigMap
      name: harbor-db-config
      valuesKey: coreDatabase
      targetPath: database.external.coreDatabase
    - kind: ConfigMap
      name: harbor-db-config
      valuesKey: host
      targetPath: database.external.host
    - kind: ConfigMap
      name: harbor-db-config
      valuesKey: port
      targetPath: database.external.port
    - kind: ConfigMap
      name: harbor-db-config
      valuesKey: sslmode
      targetPath: database.external.sslmode
    - kind: ConfigMap
      name: harbor-db-config
      valuesKey: notaryServerDatabase
      targetPath: database.external.notaryServerDatabase
    - kind: ConfigMap
      name: harbor-db-config
      valuesKey: notarySignerDatabase
      targetPath: database.external.notarySignerDatabase
  values:
    expose:
      type: clusterIP
      tls:
        enabled: false
    updateStrategy:
      type: Recreate
    externalURL: https://harbor.${SECRET_DOMAIN}
    internalTLS:
      enabled: false
      certSource: auto
    persistence:
      enabled: true
      resourcePolicy: keep
      # persistentVolumeClaim:
      # registry:
      #   existingClaim: "harbor-registry-pvc"
      # chartmuseum:
      #   existingClaim: "harbor-chartmuseum-pvc"
      # jobservice:
      # trivy:
      #   size: 5Gi
      imageChartStorage:
        disableredirect: true
        type: s3
        s3:
          existingSecret: harbor-rgw-credentials
          region: us-east-1
          bucket: harbor-registry
          regionendpoint: http://rook-ceph-rgw-ceph-objectstore-ssd.rook-ceph.svc.cluster.local:80
          forcepathstyle: true
          v4auth: true
    harborAdminPassword: Harbor12345
    portal:
      replicas: 1
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
    core:
      replicas: 1
      startupProbe:
        enabled: true
        initialDelaySeconds: 10
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
    jobservice:
      replicas: 1
    registry:
      registry:
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
      controller:
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
      replicas: 1
      credentials:
        username: harbor_registry_user
        password: harbor_registry_password
      middleware:
        enabled: false
      # Return relative Location headers on blob uploads. The registry sits
      # behind a TLS-terminating chain (Cloudflare tunnel -> envoy -> nginx)
      # that reaches it over plain HTTP, so absolute Location headers would be
      # generated with http:// and break docker push ("unknown blob").
      relativeurls: true
    chartmuseum:
      enabled: true
      replicas: 1
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
    trivy:
      enabled: true
      insecure: false
      # gitHubToken the GitHub access token to download Trivy DB
      gitHubToken: ""
      timeout: 10m0s
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1Gi
    notary:
      enabled: false
      server:
        replicas: 1
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
      signer:
        replicas: 1
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
        podAnnotations: {}
    database:
      type: external
      external: {}
        # host: ""
        # port: 0
        # username: ""
        # password: ""
        # coreDatabase: ""
        # notaryServerDatabase: ""
        # notarySignerDatabase: ""
        # sslmode: ""
      maxIdleConns: 100
      maxOpenConns: 900
      podAnnotations: {}
    redis:
      type: external
      external:
        addr: harbor-dragonfly:6379
        coreDatabaseIndex: "0"
        jobserviceDatabaseIndex: "1"
        registryDatabaseIndex: "2"
        chartmuseumDatabaseIndex: "3"
        trivyAdapterIndex: "5"
        password: ""
    exporter:
      replicas: 1
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
      cacheDuration: 23
      cacheCleanInterval: 14400
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
