---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-db
spec:
  inheritedMetadata:
    labels:
      istio.io/dataplane-mode: "none"
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql versioning=redhat
  imageName: ghcr.io/cloudnative-pg/postgresql:17.1-1
  instances: 2
  primaryUpdateStrategy: unsupervised
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  storage:
    size: 20Gi
    storageClass: ceph-block-ssd
    resizeInUseVolumes: false
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-superuser
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 512MB
      # Kill abandoned pgbouncer sessions holding advisory locks:
      # leaked idle-in-transaction backends from crashed authentik pods
      # deadlock subsequent migration runs.
      idle_in_transaction_session_timeout: "600000"
  monitoring:
    enablePodMonitor: false
  managed:
    roles:
      - name: hunter
        ensure: present
        comment: Hunter
        login: true
        superuser: true
        passwordSecret:
          name: authentik-db-hunter
        inRoles: [pg_monitor, pg_signal_backend]
      - name: authentik
        ensure: present
        comment: Authentik
        login: true
        superuser: false
        passwordSecret:
          name: authentik-db-user
        inRoles: [pg_monitor, pg_signal_backend]
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: minio-store
        serverName: authentik-v16
  bootstrap:
    # Restore pre-wipe data from the last complete base backup in the v15
    # archive (20260918T100002), replaying WALs through ~2026-09-20T02:12Z.
    # Every base backup taken after the 2026-09-24 fresh bootstrap is
    # incomplete (backup.info only, no data.tar) and no WALs were archived,
    # so this is the newest recoverable state.
    recovery:
      source: authentik-v15
      recoveryTarget:
        backupID: "20260918T100002"
      database: authentik
      owner: authentik
      secret:
        name: authentik-db-user
  externalClusters:
    - name: authentik-v15
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: minio-store
          serverName: authentik-v15
