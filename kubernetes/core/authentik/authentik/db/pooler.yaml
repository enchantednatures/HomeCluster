---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/pooler_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: authentik-db-pooler-rw
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-db
spec:
  template:
    metadata:
      labels:
        istio.io/dataplane-mode: "none"
  cluster:
    name: authentik-db
  instances: 1
  type: rw
  pgbouncer:
    # Session mode required: authentik's migration runner takes a SESSION-level
    # pg_advisory_lock. In transaction mode a client killed mid-migrate leaks
    # that lock into the pooled backend, deadlocking every subsequent boot.
    poolMode: session
    parameters:
      max_client_conn: "1000"
      default_pool_size: "25"
      min_pool_size: "5"
      reserve_pool_size: "5"
  monitoring:
    enablePodMonitor: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/pooler_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: authentik-db-pooler-ro
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-db
spec:
  template:
    metadata:
      labels:
        istio.io/dataplane-mode: "none"
  cluster:
    name: authentik-db
  instances: 1
  type: ro
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "1000"
      default_pool_size: "25"
      min_pool_size: "5"
      reserve_pool_size: "5"
  monitoring:
    enablePodMonitor: false
