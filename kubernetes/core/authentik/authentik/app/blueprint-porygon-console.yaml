# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/configmap.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-porygon-console
  namespace: authentik
  labels:
    authentik_blueprint: "true"
data:
  porygon-console.yaml: |
    ---
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: porygon-console
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: porygon-console-proxy-provider
        attrs:
          name: porygon-console-proxy-provider
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://porygon-console.${SECRET_DOMAIN}

      - model: authentik_core.application
        state: present
        identifiers:
          slug: porygon-console
        attrs:
          name: Porygon Console
          slug: porygon-console
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, porygon-console-proxy-provider]]
          launch_url: https://porygon-console.${SECRET_DOMAIN}
