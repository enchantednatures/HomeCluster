# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/configmap.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-porygon-console
  namespace: authentik
  labels:
    authentik_blueprint: "true"
data:
  porygon-console.yaml: |
    ---
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: porygon-console
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: porygon-console-proxy-provider
        attrs:
          name: porygon-console-proxy-provider
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://porygon-console.${SECRET_DOMAIN}

      - model: authentik_core.application
        state: present
        identifiers:
          slug: porygon-console
        attrs:
          name: Porygon Console
          slug: porygon-console
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, porygon-console-proxy-provider]]
          launch_url: https://porygon-console.${SECRET_DOMAIN}

      # Shared istio forward-auth outpost. This blueprint owns the outpost
      # declaration (kept self-contained so the provider above resolves in the
      # same transaction); every provider app served by it must stay listed.
      - model: authentik_outposts.outpost
        state: present
        identifiers:
          name: istio-forward-auth
        attrs:
          name: istio-forward-auth
          type: proxy
          service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, Local Kubernetes Cluster]]
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, netboot-proxy-provider]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, porygon-console-proxy-provider]]
          config:
            authentik_host: https://auth.${SECRET_DOMAIN}/
            authentik_host_insecure: true
            log_level: info
            object_naming_template: ak-outpost-%(name)s
            kubernetes_replicas: 2
            kubernetes_namespace: authentik
            kubernetes_service_type: ClusterIP
