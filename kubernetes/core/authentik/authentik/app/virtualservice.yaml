# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.istio.io/virtualservice_v1.json
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: authentik-server
  namespace: authentik
spec:
  hosts:
    - auth.${SECRET_DOMAIN}
  gateways:
    - istio-ingress/external-gateway
  http:
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: authentik-server
            port:
              number: 80
      retries:
        attempts: 3
        # Must exceed authentik's slowest responses (observed up to ~8s) or the
        # gateway cancels attempts mid-flow and surfaces 504s. Retries stay
        # connection-level only so auth requests are never replayed.
        perTryTimeout: 30s
        retryOn: connect-failure,refused-stream
