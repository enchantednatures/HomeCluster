---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/v1/mutatingpolicy.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: cnpg-disable-istio-sidecar
  annotations:
    policies.kyverno.io/title: Disable Istio Sidecar on CloudNative-PG Clusters
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.9.0
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.24"
    policies.kyverno.io/subject: Cluster
    policies.kyverno.io/description: >-
      PostgreSQL pods managed by CloudNative-PG must not run Istio sidecars
      as they interfere with streaming replication and connection pooling.
      This policy mutates all CNPG Cluster resources to inject
      inheritedMetadata that disables the Istio sidecar on managed pods.
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups:
          - postgresql.cnpg.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - clusters
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.inheritedMetadata) && has(object.spec.inheritedMetadata.annotations)
            ? [JSONPatch{op: "add", path: "/spec/inheritedMetadata/annotations/" + jsonpatch.escapeKey("sidecar.istio.io/inject"), value: "false"}]
            : (has(object.spec.inheritedMetadata)
                ? [JSONPatch{op: "add", path: "/spec/inheritedMetadata/annotations", value: {"sidecar.istio.io/inject": "false"}}]
                : [JSONPatch{op: "add", path: "/spec/inheritedMetadata", value: {"annotations": {"sidecar.istio.io/inject": "false"}}}])
