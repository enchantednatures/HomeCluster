---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/v1/mutatingpolicy.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: dragonfly-disable-istio-sidecar
  annotations:
    policies.kyverno.io/title: Disable Istio Sidecar on Dragonfly Clusters
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.9.0
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.24"
    policies.kyverno.io/subject: Dragonfly
    policies.kyverno.io/description: >-
      DragonflyDB pods must not run Istio sidecars as they interfere with
      in-memory replication. This policy mutates all Dragonfly resources to
      inject spec.annotations that disables the Istio sidecar on managed pods.
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups:
          - dragonflydb.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - dragonflies
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.annotations)
            ? [JSONPatch{op: "add", path: "/spec/annotations/" + jsonpatch.escapeKey("sidecar.istio.io/inject"), value: "false"}]
            : [JSONPatch{op: "add", path: "/spec/annotations", value: {"sidecar.istio.io/inject": "false"}}]
