---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/v1/generatingpolicy.json
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: add-cnpg-network-policy
  annotations:
    policies.kyverno.io/title: Add CloudNativePG Network Policy
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.9.0
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.24"
    policies.kyverno.io/subject: NetworkPolicy
    policies.kyverno.io/description: >-
      CloudNativePG pods require specific network access to function properly.
      This policy automatically generates a NetworkPolicy in every namespace
      that allows CNPG pods to communicate with the Kubernetes API server,
      DNS, the CNPG operator, and other PostgreSQL instances for replication.
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
  matchConditions:
    - name: exclude-namespaces
      expression: >-
        !(object.metadata.name in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno-system',
        'flux-system', 'istio-system', 'istio-ingress', 'rook-ceph', 'monitoring', 'kubevirt', 'cdi',
        'vms', 'cnpg-system']) &&
        !object.metadata.name.startsWith('knative-')
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-cnpg
            namespace: (( object.metadata.name ))
          spec:
            podSelector:
              matchExpressions:
                - key: cnpg.io/cluster
                  operator: Exists
            policyTypes:
              - Ingress
              - Egress
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: cnpg-system
                ports:
                  - protocol: TCP
                    port: 8000
              - from:
                  - podSelector: {}
                ports:
                  - protocol: TCP
                    port: 5432
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: monitoring
                ports:
                  - protocol: TCP
                    port: 9187
            egress:
              - {}
