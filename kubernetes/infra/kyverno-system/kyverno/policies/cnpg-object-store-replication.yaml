---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/v1/generatingpolicy.json
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: replicate-cnpg-object-store
  annotations:
    policies.kyverno.io/title: Replicate CloudNative-PG Object Store
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.9.0
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.24"
    policies.kyverno.io/subject: ObjectStore
    policies.kyverno.io/description: >-
      This policy replicates the minio-store ObjectStore from the postgres
      namespace to all newly created namespaces, providing a consistent barman
      backup configuration for CloudNative-PG clusters without per-namespace
      ObjectStore management.
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
  matchConditions:
    - name: exclude-namespaces
      expression: >-
        !(object.metadata.name in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno-system',
        'flux-system', 'istio-system', 'rook-ceph', 'monitoring']) &&
        !object.metadata.name.startsWith('knative-')
  variables:
    - name: nsName
      expression: object.metadata.name
    - name: source
      expression: resource.Get("barmancloud.cnpg.io/v1", "objectstores", "postgres", "minio-store")
  generate:
    - expression: generator.Apply(variables.nsName, [variables.source])
