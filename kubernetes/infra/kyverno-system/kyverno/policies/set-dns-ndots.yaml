---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/v1/mutatingpolicy.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: set-dns-ndots
  annotations:
    policies.kyverno.io/title: Set DNS ndots for Pods
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    kyverno.io/kyverno-version: 1.19.1
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.24"
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Sets dnsConfig.options.ndots to 2 on Pods. The cluster default is ndots:5,
      which makes the resolver try each search domain before the absolute name.
      A four-dot name such as loki-index-gateway.monitoring.svc.cluster.local is
      therefore preceded by several useless NXDOMAIN lookups, accounting for
      roughly two thirds of all DNS queries served by CoreDNS. ndots:2 still
      resolves bare and single-dot names via the search path while answering
      fully-qualified names on the first attempt. Pods that set their own
      dnsConfig options keep them, as the patch only merges in ndots.
      Mutation is limited to Pod creation because spec.dnsConfig is immutable
      on existing Pods; mutating UPDATE requests breaks controllers that patch
      Pod metadata (e.g. CloudNative-PG reconciliation).
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kyverno-system
            - flux-system
            - istio-system
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.dnsConfig)
            ? [JSONPatch{op: "add", path: "/spec/dnsConfig/options", value: [{"name": "ndots", "value": "2"}]}]
            : [JSONPatch{op: "add", path: "/spec/dnsConfig", value: {"options": [{"name": "ndots", "value": "2"}]}}]
