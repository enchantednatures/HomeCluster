---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/v1/generatingpolicy.json
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: replicate-pg-backup-secret
  annotations:
    policies.kyverno.io/title: Replicate PostgreSQL Backup Secret
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.9.0
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.24"
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      This policy replicates the pg-backup-secret from the postgres namespace
      to all newly created namespaces, providing S3 credentials for CloudNative-PG
      barman backups to MinIO without per-namespace secret management.
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
  matchConditions:
    - name: exclude-namespaces
      expression: >-
        !(object.metadata.name in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno-system',
        'flux-system', 'istio-system', 'rook-ceph', 'monitoring']) &&
        !object.metadata.name.startsWith('knative-')
  variables:
    - name: nsName
      expression: object.metadata.name
    - name: source
      expression: resource.Get("v1", "secrets", "postgres", "pg-backup-secret")
  generate:
    - expression: generator.Apply(variables.nsName, [variables.source])
