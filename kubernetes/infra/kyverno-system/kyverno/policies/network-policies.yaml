---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/v1/generatingpolicy.json
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: add-default-network-policy
  annotations:
    policies.kyverno.io/title: Add Default Network Policy
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.9.0
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.24"
    policies.kyverno.io/subject: NetworkPolicy
    policies.kyverno.io/description: >-
      By default, Kubernetes allows communications across all Pods within a cluster.
      Network policies and, a CNI that supports them, must be used to restrict
      communications. This policy will create a new NetworkPolicy resource whenever
      a new Namespace is created which denies all traffic.
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
  matchConditions:
    - name: exclude-namespaces
      expression: >-
        !(object.metadata.name in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno-system',
        'flux-system', 'istio-system', 'istio-ingress', 'rook-ceph', 'monitoring', 'kubevirt', 'cdi',
        'vms', 'cnpg-system', 'harbor', 'market-data', 'postgres', 'authentik', 'atuin', 'kafka',
        'redpanda', 'elastic', 'networking', 'cert-manager', 'actions-runner-system', 'arangodb',
        'dragonflydb', 'home-system', 'immich', 'irc', 'keda', 'observability', 'rabbitmq-operator',
        'tekton-pipelines', 'tekton-pipelines-resolvers', 'telepresence', 'local-path-storage',
        'cilium-secrets', 'default']) &&
        !object.metadata.name.startsWith('knative-')
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: default-deny
            namespace: (( object.metadata.name ))
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
              - Egress
