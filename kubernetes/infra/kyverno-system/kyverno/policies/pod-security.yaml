---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/v1/validatingpolicy.json
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    kyverno.io/kyverno-version: 1.9.0
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.24"
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privileged containers share namespaces with the host system, eschew cgroup
      restrictions, and do not offer any security. They should be used exclusively for
      system containers. This policy ensures privileged containers are not allowed.
spec:
  failurePolicy: Ignore
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno-system
            - rook-ceph
            - istio-system
            - atuin
            - authentik
            - harbor
            - immich
            - kellnr
            - open-webui
            - postgres
            - redpanda
            - default
            - monitoring
  autogen:
    podControllers:
      controllers:
        - daemonsets
        - deployments
        - jobs
        - statefulsets
        - replicasets
        - cronjobs
  validations:
    - message: "Containers must run as non-root user"
      expression: >-
        (!has(object.spec.securityContext) ||
         !has(object.spec.securityContext.runAsNonRoot) ||
         object.spec.securityContext.runAsNonRoot == true) &&
        object.spec.containers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.runAsNonRoot) ||
          c.securityContext.runAsNonRoot == true)
    - message: "Init containers must run as non-root user"
      expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.runAsNonRoot) ||
          c.securityContext.runAsNonRoot == true)
