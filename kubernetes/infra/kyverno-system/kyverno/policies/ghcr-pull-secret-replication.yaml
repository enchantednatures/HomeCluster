---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/v1/generatingpolicy.json
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: replicate-ghcr-pull-secret
  annotations:
    policies.kyverno.io/title: Replicate GitHub Container Registry Pull Secret
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.9.0
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.24"
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      This policy replicates the docker-regcred image pull secret from the
      flux-system namespace to all newly created namespaces as ghcr-pull-secret,
      enabling pods to pull images from the GitHub Container Registry without
      per-namespace secret management.
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
  matchConditions:
    - name: exclude-namespaces
      expression: >-
        !(object.metadata.name in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno-system',
        'flux-system', 'istio-system', 'rook-ceph', 'monitoring']) &&
        !object.metadata.name.startsWith('knative-')
  variables:
    - name: nsName
      expression: object.metadata.name
    - name: source
      expression: resource.Get("v1", "secrets", "flux-system", "docker-regcred")
    - name: target
      expression: >-
        {
          "apiVersion": variables.source.apiVersion,
          "kind": variables.source.kind,
          "metadata": {
            "name": "ghcr-pull-secret",
            "namespace": variables.nsName,
            "labels": variables.source.metadata.?labels.orValue({}),
            "annotations": variables.source.metadata.?annotations.orValue({})
          },
          "type": variables.source.?type.orValue("kubernetes.io/dockerconfigjson"),
          "data": variables.source.?data.orValue({})
        }
  generate:
    - expression: generator.Apply(variables.nsName, [variables.target])
