---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/v1/validatingpolicy.json
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-pod-resources
  annotations:
    policies.kyverno.io/title: Require Pod Resources
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.9.0
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.14"
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      As application workloads share cluster resources, it is important to limit resources
      requested and consumed by each Pod. It is recommended to require resource requests and
      limits per Pod, especially for memory and CPU. If a Namespace level request or limit is specified,
      defaults will automatically be applied to each Pod based on the LimitRange configuration.
      This policy validates that all containers have something specified for memory and CPU
      requests and memory limits.
spec:
  failurePolicy: Ignore
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - medik8s-system
            - kyverno-system
            - flux-system
            - istio-system
            - cert-manager
            - monitoring
            - kubevirt
            - cdi
            - vms
            - actions-runner-system
            - porygon
            - kafka
            - networking
            - atuin
            - authentik
            - harbor
            - immich
            - kellnr
            - open-webui
            - postgres
            - redpanda
            - default
            - rook-ceph
  autogen:
    podControllers:
      controllers:
        - daemonsets
        - deployments
        - jobs
        - statefulsets
        - replicasets
        - cronjobs
  validations:
    - message: "Resource requests and limits are required"
      expression: >-
        object.spec.containers.all(c,
          has(c.resources) &&
          has(c.resources.requests) &&
          has(c.resources.requests.memory) && c.resources.requests.memory != "" &&
          has(c.resources.requests.cpu) && c.resources.requests.cpu != "" &&
          has(c.resources.limits) &&
          has(c.resources.limits.memory) && c.resources.limits.memory != "")
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/v1/validatingpolicy.json
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.9.0
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.14"
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The ':latest' tag is mutable and can lead to unexpected errors if the
      image changes. A best practice is to use an immutable tag that maps to
      a specific version of an application Pod. This policy validates that the image
      specifies a tag and that it is not called `latest`.
spec:
  failurePolicy: Ignore
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno-system
            - flux-system
            - istio-system
            - cert-manager
            - monitoring
            - kubevirt
            - cdi
            - vms
            - redpanda
  autogen:
    podControllers:
      controllers:
        - daemonsets
        - deployments
        - jobs
        - statefulsets
        - replicasets
        - cronjobs
  validations:
    - message: "An image tag is required and it cannot be 'latest'"
      expression: >-
        object.spec.containers.all(c, has(c.image) && !c.image.endsWith(":latest")) &&
        (!has(object.spec.initContainers) ||
         object.spec.initContainers.all(c, has(c.image) && !c.image.endsWith(":latest")))
