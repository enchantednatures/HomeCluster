---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.istio.io/v1/serviceentry.json
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: rustfs-service-access
  namespace: monitoring
spec:
  hosts:
    - rustfs-service.networking.svc.cluster.local
  location: MESH_EXTERNAL
  ports:
    - name: rustfs-api
      number: 9000
      protocol: HTTP
  resolution: DNS
  endpoints:
    - address: 192.168.1.241
