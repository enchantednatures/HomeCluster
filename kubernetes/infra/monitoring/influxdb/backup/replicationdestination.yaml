# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationdestination_v1alpha1.json
# https://volsync.readthedocs.io/en/stable/usage/restic/index.html
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: influxdb-restore
  namespace: monitoring
spec:
  # Paused by default: Flux reconciles the manifest; trigger manually via
  # kubectl patch on spec.trigger.manual for restore drills
  paused: true
  trigger:
    manual: ""
  restic:
    repository: influxdb-backup-secret
    copyMethod: Direct
    destinationPVC: influxdb-influxdb2
    cacheStorageClassName: openebs-hostpath
    cacheCapacity: 10Gi
    # Mover runs as uid/gid 1000 so restored files stay influxdb-readable
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
