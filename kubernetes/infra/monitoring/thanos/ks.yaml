# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app thanos
  namespace: flux-system
spec:
  targetNamespace: monitoring
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/infra/monitoring/thanos/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: thanos-query
      namespace: monitoring
    - apiVersion: apps/v1
      kind: Deployment
      name: thanos-query-frontend
      namespace: monitoring
    - apiVersion: apps/v1
      kind: StatefulSet
      name: thanos-store
      namespace: monitoring
    - apiVersion: apps/v1
      kind: StatefulSet
      name: thanos-compact
      namespace: monitoring
  interval: 30m
  retryInterval: 1m
  timeout: 10m
