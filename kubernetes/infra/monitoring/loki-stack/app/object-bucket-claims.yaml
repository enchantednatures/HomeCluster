# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/objectbucket.io/v1alpha1/objectbucketclaim.json
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: &app loki-chunks
  namespace: monitoring
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/part-of: loki
    bucket-notification-loki-chunks-objects: loki-chunks-objects
spec:
  bucketName: loki-chunks
  storageClassName: ceph-bucket-retain
