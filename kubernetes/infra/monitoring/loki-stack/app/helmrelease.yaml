# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 5m
  dependsOn:
    - name: prometheus-operator-crds
  chart:
    spec:
      chart: loki
      version: 7.3.0 # datasource=helm depName=loki repository=https://grafana.github.io/helm-charts
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 10m
  install:
    timeout: 15m
    replace: true
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    cleanupOnFail: true
    crds: CreateReplace
  test:
    enable: true
  rollback:
    recreate: true
    force: true
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
  maxHistory: 3
  values:
    deploymentMode: "Distributed"

    # Gateway configuration
    gateway:
      enabled: true
      service:
        type: ClusterIP
      replicas: 2

    # Loki configuration
    loki:
      auth_enabled: false
      commonConfig:
        path_prefix: /var/loki
        replication_factor: 1
      structuredConfig:
        compactor:
          delete_request_store: s3
          retention_enabled: true
      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
        retention_period: 720h
        deletion_mode: disabled
      ingester:
        chunk_encoding: snappy
      querier:
        max_concurrent: 4
      pattern_ingester:
        enabled: true
      schemaConfig:
        configs:
          - from: "2020-10-24"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: s3
        # All Loki data shares one bucket: a single ObjectBucketClaim yields one
        # credential set, and Loki supports backing the Ruler with the chunks
        # bucket. Separate buckets would each need their own provisioned user.
        bucketNames:
          chunks: loki-chunks
          ruler: loki-chunks
          admin: loki-chunks
        s3:
          endpoint: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc.cluster.local:80
          region: us-east-1
          insecure: true
          s3forcepathstyle: true
          signatureVersion: v4
      storage_config:
        tsdb_shipper:
          active_index_directory: /var/loki/tsdb-index
          cache_location: /var/loki/tsdb-cache
          cache_ttl: 24h
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true

    # Microservices components
    ingester:
      replicas: 3
      zoneAwareReplication:
        enabled: false
      persistence:
        enabled: true
        storageClass: ceph-block
        size: 10Gi

    querier:
      replicas: 3
      maxUnavailable: 2

    queryFrontend:
      replicas: 2
      maxUnavailable: 1

    queryScheduler:
      replicas: 2

    distributor:
      replicas: 3
      maxUnavailable: 2

    compactor:
      replicas: 1
      persistence:
        enabled: true
        storageClass: ceph-block
        size: 10Gi

    indexGateway:
      replicas: 2
      maxUnavailable: 1

    ruler:
      replicas: 1
      persistence:
        enabled: true
        storageClass: ceph-block
        size: 10Gi

    # Disable unused components
    bloomPlanner:
      replicas: 0
    bloomBuilder:
      replicas: 0
    bloomGateway:
      replicas: 0

    # Disable legacy components
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    singleBinary:
      replicas: 0
  valuesFrom:
    - targetPath: loki.storage.s3.access_key_id
      kind: Secret
      name: loki-chunks
      valuesKey: AWS_ACCESS_KEY_ID
    - targetPath: loki.storage.s3.secret_access_key
      kind: Secret
      name: loki-chunks
      valuesKey: AWS_SECRET_ACCESS_KEY
