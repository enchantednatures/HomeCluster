# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pushgateway
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-pushgateway
      version: 3.10.1 # datasource=helm depName=prometheus-pushgateway repository=oci://ghcr.io/prometheus-community/charts
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: pushgateway
    persistentVolume:
      enabled: true
      size: 1Gi
      storageClass: ceph-block
    serviceMonitor:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
