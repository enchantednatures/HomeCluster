---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 30m
  chart:
    spec:
      chart: grafana
      version: 10.5.15 # datasource=helm depName=grafana repository=https://grafana.github.io/helm-charts
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    replicas: 1
    deploymentStrategy:
      type: Recreate
    admin:
      existingSecret: grafana-admin-secret
    env:
      GF_EXPLORE_ENABLED: true
      GF_SERVER_ROOT_URL: https://grafana.${SECRET_DOMAIN}
    envFromSecrets:
      - name: grafana-oauth-secret
    grafana.ini:
      server: # Add this section
        cookie_secure: true
      auth:
        signout_redirect_url: https://auth.${SECRET_DOMAIN}/application/o/grafana/end-session/
        oauth_auto_login: true
      auth.generic_oauth:
        name: authentik
        enabled: true
        allow_assign_grafana_admin: true
        scopes: openid profile email
        auth_url: https://auth.${SECRET_DOMAIN}/application/o/authorize/
        token_url: http://authentik-server.authentik.svc.cluster.local/application/o/token/
        api_url: http://authentik-server.authentik.svc.cluster.local/application/o/userinfo/
        # Optionally map user groups to Grafana roles
        role_attribute_path:
          contains(groups, 'Grafana Admins') && 'Admin' || contains(groups,
          'Grafana Editors') && 'Editor' || 'Viewer'
      auth.basic:
        enabled: false
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        reporting_enabled: false
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
          - name: flux
            orgId: 1
            folder: Flux
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/flux
          - name: kubernetes
            orgId: 1
            folder: Kubernetes
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes
          - name: nginx
            orgId: 1
            folder: Nginx
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/nginx
          - name: kafka
            orgId: 1
            folder: Kafka
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kafka
    datasources:
      datasources.yaml:
        apiVersion: 1
        deleteDatasources:
          - name: Prometheus
            orgId: 1
          - name: Loki
            orgId: 1
          - name: Alertmanager
            orgId: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://loki-gateway.monitoring.svc.cluster.local:80
            jsonData:
              manageAlerts: true
              maxLines: 250
          - name: Alertmanager-Kube-Prometheus-Stack
            type: alertmanager
            access: proxy
            url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
            jsonData:
              implementation: prometheus
              handleGrafanaManagedAlerts: true
            isDefault: false
          - name: Prometheus
            type: prometheus
            uid: prometheus
            access: proxy
            url: http://thanos-query-frontend.monitoring.svc.cluster.local:9090
            jsonData:
              manageAlerts: true
              prometheusType: Prometheus
            isDefault: false
          - name: Tempo
            type: tempo
            url: http://tempo.monitoring.svc.cluster.local:3100
            access: proxy
            jsonData:
              tracesToLogsV2:
                datasourceUid: Loki
                tags: [job, instance, pod, namespace]
                filterByTraceID: true
                filterBySpanID: true
                customQuery: true
              tracesToMetrics:
                datasourceUid: Prometheus
                tags:
                  - { key: service.name, value: service }
                  - { key: job }
              serviceMap:
                datasourceUid: Prometheus
              nodeGraph:
                enabled: true
              search:
                hide: false
              lokiSearch:
                datasourceUid: Loki
              traceQuery:
                timeShiftEnabled: true
              spanBar:
                type: Tag
                tag: http.path
            isDefault: false
    dashboards:
      default:
        cloudflared:
          gnetId: 17457 # https://grafana.com/grafana/dashboards/17457?tab=revisions
          revision: 6
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
        external-dns:
          gnetId: 15038 # https://grafana.com/grafana/dashboards/15038?tab=revisions
          revision: 1
          datasource: Prometheus
        # cert-manager:
        #   url: https://raw.githubusercontent.com/monitoring-mixins/website/master/assets/cert-manager/dashboards/cert-manager.json
        #   datasource: Prometheus
        node-exporter-full:
          gnetId: 1860 # https://grafana.com/grafana/dashboards/1860?tab=revisions
          revision: 31
          datasource: Prometheus
      flux:
        flux-cluster:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/cluster.json
          datasource: Prometheus
        flux-control-plane:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/control-plane.json
          datasource: Prometheus
      kubernetes:
        kubernetes-api-server:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
          datasource: Prometheus
        kubernetes-coredns:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
          datasource: Prometheus
        kubernetes-global:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
          datasource: Prometheus
        kubernetes-namespaces:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
          datasource: Prometheus
        kubernetes-nodes:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
          datasource: Prometheus
        kubernetes-pods:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
          datasource: Prometheus
      nginx:
        nginx:
          url: https://raw.githubusercontent.com/kubernetes/ingress-nginx/master/deploy/grafana/dashboards/nginx.json
          datasource: Prometheus
        nginx-request-handling-performance:
          url: https://raw.githubusercontent.com/kubernetes/ingress-nginx/master/deploy/grafana/dashboards/request-handling-performance.json
          datasource: Prometheus
      kafka:
        cruise-control:
          url: https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/refs/tags/0.45.0/examples/metrics/grafana-dashboards/strimzi-cruise-control.json
          datasource: Prometheus
        kafka:
          url: https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/refs/tags/0.45.0/examples/metrics/grafana-dashboards/strimzi-kafka.json
          datasource: Prometheus
    # Grafana-managed alerts are forwarded to the kube-prometheus-stack Alertmanager,
    # whose Discord receiver delivers them. Keep {{ }} Helm-escaped (chart 10.x applies
    # templating to alerting values) or the rule annotations below break.
    alerting:
      contactpoints.yaml:
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: alertmanager
            receivers:
              - uid: alertmanager-forward
                type: prometheus-alertmanager
                disableResolveMessage: false
                settings:
                  url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: alertmanager
            group_by:
              - grafana_folder
              - alertname
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
      kubernetes-health.yaml:
        apiVersion: 1
        groups:
          - orgId: 1
            name: kubernetes-health
            folder: Kubernetes
            interval: 1m
            rules:
              - uid: node-down
                title: Node Down
                condition: C
                for: 5m
                noDataState: Alerting
                execErrState: Error
                labels:
                  severity: critical
                annotations:
                  summary: 'Node {{ "{{" }} $labels.instance {{ "}}" }} has been unreachable for 5 minutes.'
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: prometheus
                    model:
                      datasource:
                        type: prometheus
                        uid: prometheus
                      editorMode: code
                      expr: 'up{job="node-exporter"} == 0'
                      instant: true
                      intervalMs: 1000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - &reduce-last
                    refId: B
                    datasourceUid: __expr__
                    model:
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      reducer: last
                      type: reduce
                  - &threshold-lt-1
                    refId: C
                    datasourceUid: __expr__
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 1
                            type: lt
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: B
                      intervalMs: 1000
                      maxDataPoints: 43200
                      type: threshold
              - uid: pod-crashlooping
                title: Pod Crash Looping
                condition: C
                for: 5m
                noDataState: OK
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: 'Container {{ "{{" }} $labels.container {{ "}}" }} in pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} restarted {{ "{{" }} printf "%.0f" $value {{ "}}" }} times in the last hour.'
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: prometheus
                    model:
                      datasource:
                        type: prometheus
                        uid: prometheus
                      editorMode: code
                      expr: 'sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[1h]))'
                      instant: true
                      intervalMs: 1000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - *reduce-last
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 5
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: B
                      intervalMs: 1000
                      maxDataPoints: 43200
                      type: threshold
              - uid: pod-oomkilled
                title: Container OOMKilled
                condition: C
                for: 1m
                noDataState: OK
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: 'Container {{ "{{" }} $labels.container {{ "}}" }} in pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} was OOM-killed.'
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: prometheus
                    model:
                      datasource:
                        type: prometheus
                        uid: prometheus
                      editorMode: code
                      expr: 'kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1'
                      instant: true
                      intervalMs: 1000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - *reduce-last
                  - &threshold-gt-0
                    refId: C
                    datasourceUid: __expr__
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 0
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: B
                      intervalMs: 1000
                      maxDataPoints: 43200
                      type: threshold
              - uid: pod-pending
                title: Pod Stuck Pending
                condition: C
                for: 15m
                noDataState: OK
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: 'Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} has been Pending for more than 15 minutes.'
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: prometheus
                    model:
                      datasource:
                        type: prometheus
                        uid: prometheus
                      editorMode: code
                      expr: 'kube_pod_status_phase{phase="Pending"} == 1'
                      instant: true
                      intervalMs: 1000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - *reduce-last
                  - *threshold-gt-0
              - uid: pod-image-pull-error
                title: Pod Image Pull Error
                condition: C
                for: 5m
                noDataState: OK
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: 'Container {{ "{{" }} $labels.container {{ "}}" }} in pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} cannot pull its image ({{ "{{" }} $labels.reason {{ "}}" }}).'
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: prometheus
                    model:
                      datasource:
                        type: prometheus
                        uid: prometheus
                      editorMode: code
                      expr: 'kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff"} == 1'
                      instant: true
                      intervalMs: 1000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - *reduce-last
                  - *threshold-gt-0
              - uid: container-not-ready
                title: Container Not Ready
                condition: C
                for: 15m
                noDataState: OK
                execErrState: Error
                labels:
                  severity: warning
                annotations:
                  summary: 'Container {{ "{{" }} $labels.container {{ "}}" }} in pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} has not been ready for more than 15 minutes.'
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: prometheus
                    model:
                      datasource:
                        type: prometheus
                        uid: prometheus
                      editorMode: code
                      expr: 'kube_pod_container_status_ready == 0'
                      instant: true
                      intervalMs: 1000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - *reduce-last
                  - *threshold-lt-1

    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
        labelValue: ""
        label: grafana_dashboard
        folderAnnotation: grafana_folder
        provider:
          disableDelete: true
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        searchNamespace: ALL
        labelValue: ""
    serviceMonitor:
      enabled: true
    ingress:
      enabled: false
    testFramework:
      enabled: false
    extraSecretMounts:
      - name: auth-generic-oauth-secret-mount
        secretName: grafana-oauth-secret
        defaultMode: 0440
        mountPath: /etc/secrets/auth_generic_oauth
        readOnly: true
