# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: operator.knative.dev/v1beta1
kind: KnativeServing
metadata:
  name: knative-serving
  namespace: knative-serving
spec:
  version: "1.20.0"
  ingress:
    istio:
      enabled: true
      knative-ingress-gateway:
        selector:
          istio: gateway
  config:
    network:
      ingress-class: "istio" # Matches your IngressClass name
    logging:
      loglevel.controller: "info"
      loglevel.autoscaler: "info"
      loglevel.queueproxy: "info"
      loglevel.webhook: "info"
      loglevel.activator: "info"
    observability:
      logging.enable-request-log: "true"
      # logging.enable-probe-request-log: "true"
      metrics.backend-destination: "prometheus"
    istio:
      # Gateway Services are generated by net-istio (do not manage them by hand).
      # labelSelector must match this cluster's custom gateway pod label
      # (istio: gateway), otherwise the generated Services have no endpoints and
      # cluster-local Ingresses never become ready.
      external-gateways: |
        - name: knative-ingress-gateway
          namespace: knative-serving
          service: istio-ingressgateway.istio-ingress.svc.cluster.local
          labelSelector:
            matchLabels:
              istio: gateway
      local-gateways: |
        - name: knative-local-gateway
          namespace: knative-serving
          service: knative-local-gateway.istio-ingress.svc.cluster.local
          labelSelector:
            matchLabels:
              istio: gateway
    features:
      queueproxy.resource-defaults: "enabled"
    autoscaler:
      enable-scale-to-zero: "true"
      scale-to-zero-grace-period: "30s"
      stable-window: "60s"
      panic-window-percentage: "10"
      max-scale-up-rate: "1000"
      max-scale-down-rate: "2"
      target-burst-capacity: "200"
  high-availability:
    replicas: 2 # Reduced for home lab
