---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  driftDetection:
    mode: enabled
    ignore:
      # caBundle is injected at runtime by the KEDA operator.
      - paths:
          - /webhooks
        target:
          group: admissionregistration.k8s.io
          kind: (MutatingWebhookConfiguration|ValidatingWebhookConfiguration)
      # The operator patches the APIService caBundle with its generated CA.
      - paths:
          - /spec/caBundle
        target:
          group: apiregistration.k8s.io
          kind: APIService
          name: v1beta1.external.metrics.k8s.io
  interval: 30m
  chart:
    spec:
      chart: keda
      version: 2.20.2 # datasource=helm depName=keda repository=https://kedacore.github.io/charts
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values: {}
