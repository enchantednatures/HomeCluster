# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
spec:
  driftDetection:
    mode: enabled
    ignore:
      # caBundle is injected at runtime by istiod.
      - paths:
          - /webhooks
        target:
          group: admissionregistration.k8s.io
          kind: (MutatingWebhookConfiguration|ValidatingWebhookConfiguration)
  interval: 30m
  chart:
    spec:
      chart: base
      version: 1.30.4 # datasource=helm depName=base repository=https://istio-release.storage.googleapis.com/charts
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values: {}
