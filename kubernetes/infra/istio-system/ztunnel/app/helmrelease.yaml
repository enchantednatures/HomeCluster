---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: istio-system
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  dependsOn:
    - name: istio-base
    - name: istio-cni
    - name: istiod
  chart:
    spec:
      chart: ztunnel
      version: 1.30.5 # datasource=helm depName=ztunnel repository=https://istio-release.storage.googleapis.com/charts
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  maxHistory: 2
  install:
    disableWait: true
    disableWaitForJobs: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    disableWaitForJobs: true
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    logLevel: info
    # No limits (Istio guidance): CPU limits throttle a shared node proxy and a
    # memory limit risks a cluster-wide ztunnel OOM outage. Requests stay low
    # so the DaemonSet remains schedulable on CPU-saturated nodes.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
              - work-00
              - work-03
