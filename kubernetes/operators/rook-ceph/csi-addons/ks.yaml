---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app csi-addons
  namespace: flux-system
  labels:
    # Disable Flux envsubst: vendored CRDs contain regex end-anchors ($) and the
    # controller args use $(POD_NAMESPACE); these must NOT be substituted by postBuild
    substitution.flux.home.arpa/disabled: "true"
spec:
  targetNamespace: csi-addons-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-operator
  path: ./kubernetes/operators/rook-ceph/csi-addons/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 2m
  timeout: 5m
