---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rook-ceph-cluster
  namespace: flux-system
  labels:
    # Disable Flux envsubst: manifests contain shell variables ($VAR) in
    # toolbox/Job scripts that must NOT be substituted by postBuild
    substitution.flux.home.arpa/disabled: "true"
spec:
  targetNamespace: rook-ceph
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-operator
  path: ./kubernetes/operators/rook-ceph/cluster/app
  prune: true # TEMP: prune required to remove the CephCluster CR for the clean rebuild; revert to false after
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 2m
  timeout: 30m
  healthChecks:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
    - apiVersion: apps/v1
      kind: Deployment
      name: rook-ceph-mgr-a
      namespace: rook-ceph
