  - ./ceph-object-store-secret.sops.yaml
  - ./harbor-rgw-keys.sops.yaml
  - ./kellnr-rgw-keys.sops.yaml
  - ./ceph-objectstore-admin-user.yaml
  - ./ceph-objectstore-user-harbor.yaml
  - ./ceph-objectstore-user-kellnr.yaml
  - ./grafana-dashboard-configmap.yaml
  - ./ceph-dashboard-grafana.yaml
  # - ./network-policies-enhanced.yaml  # Temporarily disabled due to port range validation
  - ./poddisruptionbudget.yaml
  - ./service-monitor.yaml
  - ./prometheus-rules.yaml
  - ./volume-snapshot-class.yaml
  - ./ingress-tailscale.yaml
  - ./rbac-enhanced.yaml
  - ./backup-strategy-enhanced.yaml
  # Sample bucket claim for testing - comment out in production
  # - ./sample-bucket-claim.yaml
