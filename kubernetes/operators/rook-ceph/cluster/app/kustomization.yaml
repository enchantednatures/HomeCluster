# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.config.k8s.io/kustomization_v1beta1.json
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ceph-cluster.yaml
  - ./csi-driver.yaml
  - ./csi-operator-config.yaml
  - ./csi-image-set.yaml
  - ./csi-plugin-rbac.yaml
  - ./rbd-stash-repair.yaml
  - ./ceph-toolbox.yaml  # Standalone Deployment - no CephToolbox CRD required
  - ./ceph-discovery-job.yaml
  - ./ceph-crash-archive-job.yaml  # one-shot Job split from ceph-crash-hygiene.yaml so Renovate only manages the CronJob file
  - ./ceph-crash-hygiene.yaml
  - ./ceph-reclass-job.yaml
  - ./ceph-rehome-ssd-job.yaml
  - ./ceph-reclass-nvme-job.yaml
  - ./ceph-endstate-verify.yaml
  - ./storage-classes.yaml
  - ./storage-classes-enhanced.yaml
  - ./ceph-filesystem.yaml
  - ./ceph-object-store.yaml
  - ./ceph-objectstore-ssd.yaml
  - ./ceph-objectstore-nvme.yaml
  # - ./virtual-service.yaml  # Superseded by ../exposure/virtual-service.yaml (envsubst disabled in this Kustomization)
