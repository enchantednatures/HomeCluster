# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps/daemonset.json
---
# Keeps ceph-csi per-volume metadata stashes free of the invalid `rxbounce`
# unmap option. Legacy RBD volumes (PVs provisioned before commit 90136f526
# dropped `unmapOptions: krbd:rxbounce` from the storage classes) still carry
# that value in their immutable PV volumeAttributes; ceph-csi re-writes it
# into image-meta.json on every NodeStage, and `rbd unmap` rejects it, which
# deadlocks volume reattach (see issue #1483). This guard strips the option
# so unmaps fall back to the default `noudev` only. Remove once all legacy
# PVs have been recreated/migrated (issue #1483).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rbd-stash-repair
  namespace: rook-ceph
  labels:
    app.kubernetes.io/name: rbd-stash-repair
    app.kubernetes.io/part-of: rook-ceph
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rbd-stash-repair
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbd-stash-repair
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: repair
          # datasource=docker depName=alpine
          image: alpine:3.24
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do
                for f in /var/lib/kubelet/plugins/kubernetes.io/csi/rook-ceph.rbd.csi.ceph.com/*/globalmount/image-meta.json; do
                  [ -f "$f" ] || continue
                  if grep -qE '"unmapOptions":"[^"]*rxbounce[^"]*"' "$f"; then
                    sed -E -i 's/"unmapOptions":"[^"]*rxbounce[^"]*"/"unmapOptions":""/' "$f" && echo "repaired $f"
                  fi
                done
                sleep 60
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: csi-staging
              mountPath: /var/lib/kubelet/plugins/kubernetes.io/csi/rook-ceph.rbd.csi.ceph.com
      volumes:
        - name: csi-staging
          hostPath:
            path: /var/lib/kubelet/plugins/kubernetes.io/csi/rook-ceph.rbd.csi.ceph.com
            type: DirectoryOrCreate
