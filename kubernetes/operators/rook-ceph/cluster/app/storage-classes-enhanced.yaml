---
# High-performance block pool optimized for SSDs
#
# SINGLE COPY BY DESIGN. `default~ssd` only holds osd.3 (447GiB) and osd.8
# (932GiB). osd.8 is itself ~94% full of *other* pools (ceph-blockpool and the
# RGW bucket pool), so a second replica can never be placed there and every PG
# sat `active+undersized+degraded+backfill_toofull` with osd.8 backfillfull.
# The pool only holds ~354GiB of data, which fits on osd.3 alone. Do not raise
# this to 2 until the fast OSDs have real headroom.
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: ceph-blockpool-ssd
  namespace: rook-ceph
  labels:
    app.kubernetes.io/part-of: rook-ceph
    pool-type: ssd
spec:
  failureDomain: host
  replicated:
    size: 1
    requireSafeReplicaSize: false
  deviceClass: ssd
  parameters:
    compression_mode: "none"  # Disable compression for maximum performance
    pg_num: "16"
    pgp_num: "16"
    pg_autoscale_mode: "off"
    target_size_ratio: "0.04"  # informational only with autoscale off
  quotas:
    maxBytes: 536870912000  # 500Gi in bytes - Adjust based on your cluster capacity
  statusCheck:
    mirror:
      disabled: false
      interval: 60s
---
# High-performance storage class for latency-sensitive workloads
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-block-ssd
  labels:
    app.kubernetes.io/part-of: rook-ceph
    performance-tier: high
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    description: "High-performance SSD storage for latency-sensitive workloads"
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: ceph-blockpool-ssd
  imageFormat: "2"
  imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
  # Performance tuning parameters
  mapOptions: "krbd:rxbounce"
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - discard
  - noatime  # Improve performance by not updating access times
---
# Economy storage class for bulk data
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: ceph-blockpool-economy
  namespace: rook-ceph
  labels:
    app.kubernetes.io/part-of: rook-ceph
    pool-type: economy
spec:
  failureDomain: osd
  replicated:
    size: 2  # Lower replication for cost savings
    requireSafeReplicaSize: false
  deviceClass: hdd
  parameters:
    compression_mode: aggressive  # Aggressive compression for space savings
    compression_algorithm: lz4    # Fast compression algorithm
    pg_num: "32"
    pgp_num: "32"
    pg_autoscale_mode: "off"
    target_size_ratio: "0.2"  # informational only with autoscale off
  quotas:
    maxBytes: 3298534883328  # 3TiB - bulk HDD pool for lancache and app migration
---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-block-economy
  labels:
    app.kubernetes.io/part-of: rook-ceph
    performance-tier: economy
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    description: "Economy storage with compression for bulk data"
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: ceph-blockpool-economy
  imageFormat: "2"
  imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer  # Better scheduling
mountOptions:
  - discard
---
# Ultra-high-performance block pool optimized for NVMe drives
#
# SINGLE COPY BY DESIGN, same reason as ceph-blockpool-ssd: the nvme OSDs
# (osd.4-7, 233GiB each) are ~94% full of ceph-blockpool and RGW data, leaving
# only a few GiB of pool headroom at size 2. This pool holds <1GiB today.
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: ceph-blockpool-nvme
  namespace: rook-ceph
  labels:
    app.kubernetes.io/part-of: rook-ceph
    pool-type: nvme
spec:
  failureDomain: host
  replicated:
    size: 1
    requireSafeReplicaSize: false
  deviceClass: nvme  # osd.4-7: 250GB WD Blue SN570 NVMe passed to work-00..03
  parameters:
    compression_mode: "none"  # Disable compression for maximum performance
    pg_num: "32"
    pgp_num: "32"
    pg_autoscale_mode: "off"
    target_size_ratio: "0.04"  # informational only with autoscale off
  statusCheck:
    mirror:
      disabled: false
      interval: 60s
---
# Ultra-high-performance storage class for NVMe drives
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-nvme-block
  labels:
    app.kubernetes.io/part-of: rook-ceph
    performance-tier: ultra-high
    device-type: nvme
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    description: "Ultra-high-performance NVMe storage for latency-critical workloads"
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: ceph-blockpool-nvme
  imageFormat: "2"
  imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate  # Faster binding for NVMe performance
---
# NVMe storage class with compression disabled for maximum speed
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-nvme-ssd
  labels:
    app.kubernetes.io/part-of: rook-ceph
    performance-tier: ultra-high
    device-type: nvme
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    description: "NVMe storage with compression disabled for maximum throughput"
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: ceph-blockpool-nvme
  imageFormat: "2"
  imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
  compression: none  # Explicitly disable compression
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
