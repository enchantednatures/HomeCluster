---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: ceph-block-snapshot
  labels:
    app.kubernetes.io/part-of: rook-ceph
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
driver: rook-ceph.rbd.csi.ceph.com
# Delete, not Retain. The daily volume-snapshot CronJob deletes VolumeSnapshots
# on a retention window; with Retain the VolumeSnapshotContent (and the backing
# RBD snapshot) survived forever, so the pools grew without bound and took the
# cluster to HEALTH_ERR. Retaining the Kubernetes object is not a backup:
# real backups go off-cluster via VolSync/restic.
deletionPolicy: Delete
parameters:
  clusterID: rook-ceph
  csi.storage.k8s.io/snapshotter-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/snapshotter-secret-namespace: rook-ceph
---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: ceph-block-snapshot-delete
  labels:
    app.kubernetes.io/part-of: rook-ceph
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "false"
driver: rook-ceph.rbd.csi.ceph.com
deletionPolicy: Delete  # Delete snapshots when VolumeSnapshotClass is deleted
parameters:
  clusterID: rook-ceph
  csi.storage.k8s.io/snapshotter-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/snapshotter-secret-namespace: rook-ceph
