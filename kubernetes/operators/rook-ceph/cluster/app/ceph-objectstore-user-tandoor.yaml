---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: tandoor
  namespace: rook-ceph
  labels:
    app.kubernetes.io/name: tandoor
    app.kubernetes.io/instance: ceph-objectstore
    app.kubernetes.io/component: object-storage
spec:
  store: ceph-objectstore
  displayName: "Tandoor recipe media user"
  keys:
    - accessKeyRef:
        name: tandoor-rgw-keys
        key: access-key
      secretKeyRef:
        name: tandoor-rgw-keys
        key: secret-key
