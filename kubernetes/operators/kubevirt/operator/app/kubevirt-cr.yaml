---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates:
        - Snapshot
        - VMExport
        - HotplugVolumes
        - HostDevices
    permittedHostDevices:
      pciHostDevices:
        - pciVendorSelector: "10DE:2206"
          resourceName: "nvidia.com/RTX3080"
        - pciVendorSelector: "10DE:1AEF"
          resourceName: "nvidia.com/RTX3080_AUDIO"
  infra:
    nodePlacement:
      tolerations:
        - key: dedicated
          operator: Equal
          value: gaming
          effect: NoSchedule
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
