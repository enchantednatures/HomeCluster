# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master-standalone-strict/_definitions.json
---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch-v8
  namespace: elastic
spec:
  version: 8.19.23
  volumeClaimDeletePolicy: DeleteOnScaledownOnly
  http:
    service:
      metadata:
        annotations:
          io.cilium/lb-ipam-ips: 192.168.1.226
      spec:
        type: LoadBalancer
    tls:
      selfSignedCertificate:
        disabled: false
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: "1"
                  memory: 4Gi
                limits:
                  memory: 4Gi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
            storageClassName: ceph-block
