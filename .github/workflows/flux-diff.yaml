---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flux Diff
on:
  pull_request:
    branches: [main]
    paths: [kubernetes/**, .github/workflows/flux-diff.yaml]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true
jobs:
  flux-diff:
    name: Flux Diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        paths: [kubernetes]
        resources: [helmrelease, kustomization]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup flate
        uses: home-operations/flate/action@v0.5.0
        with:
          cache: true
      - name: Diff Resources
        id: diff
        env:
          RESOURCES: ${{ matrix.resources }}
        run: |
          set -o pipefail
          case "${RESOURCES}" in
            helmrelease) target="hr" ;;
            kustomization) target="ks" ;;
          esac
          rc=0
          flate diff "${target}" \
            --path ./kubernetes \
            -o diff > diff-full.patch 2>&1 || rc=$?
          head -c 60000 diff-full.patch > diff.patch || true
          cat diff.patch
          echo "diff<<EOF" >> "$GITHUB_OUTPUT"
          cat diff.patch >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          exit "${rc}"
      - if: ${{ always() }}
        name: Add comment
        uses: mshick/add-pr-comment@v3
        with:
          message-id: ${{ github.event.pull_request.number }}/${{ matrix.paths }}/${{
            matrix.resources }}
          message-failure: Diff was not successful
          message: |-
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```
